<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Rainscreen transition check</title>
  <desc id="desc">A facade elevation diagram identifying the critical water-control transitions around windows, parapets, bases, balconies, corners and penetrations.</desc>
  <rect width="1600" height="900" fill="#0f1514"/>
  <text x="105" y="105" fill="#d8b777" font-family="Georgia, serif" font-size="28" letter-spacing="7">WORLD ARCH JOURNAL · DETAIL MAP</text>
  <text x="105" y="180" fill="#f4efe5" font-family="Georgia, serif" font-size="58">The facade fails at transitions</text>
  <text x="105" y="228" fill="#aeb7b2" font-family="Arial, sans-serif" font-size="23">Trace the water-control layer without lifting the pen.</text>
  <g font-family="Arial, sans-serif">
    <rect x="390" y="300" width="820" height="480" fill="#1c2321" stroke="#6b7771" stroke-width="4"/>
    <rect x="610" y="420" width="370" height="230" fill="#101514" stroke="#d8b777" stroke-width="9"/>
    <line x1="610" y1="402" x2="980" y2="402" stroke="#5d817e" stroke-width="18"/>
    <line x1="610" y1="668" x2="980" y2="668" stroke="#5d817e" stroke-width="18"/>
    <circle cx="795" cy="310" r="15" fill="#d8b777"/><circle cx="596" cy="405" r="15" fill="#d8b777"/>
    <circle cx="994" cy="665" r="15" fill="#d8b777"/><circle cx="470" cy="700" r="15" fill="#d8b777"/>
    <circle cx="1125" cy="515" r="15" fill="#d8b777"/><circle cx="795" cy="785" r="15" fill="#d8b777"/>
    <g fill="#f4efe5" font-size="22">
      <text x="122" y="332">01 · PARAPET / ROOF</text><line x1="330" y1="325" x2="780" y2="312" stroke="#d8b777" stroke-width="2"/>
      <text x="122" y="444">02 · WINDOW HEAD</text><line x1="330" y1="437" x2="580" y2="408" stroke="#d8b777" stroke-width="2"/>
      <text x="122" y="716">03 · BASE / PODIUM</text><line x1="330" y1="708" x2="455" y2="702" stroke="#d8b777" stroke-width="2"/>
      <text x="1235" y="440">04 · CORNER</text><line x1="1218" y1="447" x2="1135" y2="505" stroke="#d8b777" stroke-width="2"/>
      <text x="1235" y="585">05 · SILL + JAMB</text><line x1="1218" y1="578" x2="1008" y2="662" stroke="#d8b777" stroke-width="2"/>
      <text x="1045" y="825">06 · DRAINAGE EXIT</text><line x1="1025" y1="815" x2="810" y2="790" stroke="#d8b777" stroke-width="2"/>
    </g>
    <text x="795" y="520" fill="#d8b777" font-size="26" text-anchor="middle">OPENING</text>
    <text x="795" y="555" fill="#9eaaa4" font-size="20" text-anchor="middle">head · jamb · sill · end dams</text>
  </g>
</svg>
