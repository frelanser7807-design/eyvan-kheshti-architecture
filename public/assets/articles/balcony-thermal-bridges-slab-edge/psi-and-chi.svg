<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc"><title id="title">Use the right quantity for the junction</title><desc id="desc">Conceptual comparison of a linear edge and an individual localised penetration. Values require assessment of the actual geometry. The diagrams are not thermal simulations.</desc><rect width="1600" height="900" fill="#f3f2eb"/><g font-family="Arial, sans-serif"><text x="64" y="65" font-size="20" fill="#547f70" font-weight="700">WORLD ARCH JOURNAL / DESIGN NOTES</text><text x="64" y="132" font-size="44" fill="#203b42" font-weight="700">Use the right quantity for the junction</text><text x="64" y="182" font-size="25" fill="#53696d" font-weight="400">Conceptual comparison of a linear edge and an individual localised penetration.</text><rect x="64" y="238" width="708" height="460" rx="12" fill="#fff" stroke="#c7d2ce" stroke-width="2"/><rect x="800" y="238" width="736" height="460" rx="12" fill="#fff" stroke="#c7d2ce" stroke-width="2"/><text x="96" y="294" font-size="32" fill="#203b42" font-weight="700">LINEAR BRIDGE / ψ</text><text x="832" y="294" font-size="32" fill="#203b42" font-weight="700">POINT BRIDGE / χ</text><rect x="112" y="358" width="600" height="88" rx="0" fill="#bfd0c1" stroke="#547f70" stroke-width="2"/><path d="M130 401 L692 401" fill="none" stroke="#b56439" stroke-width="12"/><text x="112" y="500" font-size="28" fill="#203b42" font-weight="400">A junction extending along an edge</text><text x="112" y="556" font-size="34" fill="#b56439" font-weight="700">ψ × length → W/K</text><text x="112" y="612" font-size="27" fill="#203b42" font-weight="400">ψ unit: W/(m·K)</text><rect x="848" y="358" width="620" height="88" rx="0" fill="#bfd0c1" stroke="#547f70" stroke-width="2"/><circle cx="1158" cy="401" r="23" fill="#b56439"/><text x="848" y="500" font-size="28" fill="#203b42" font-weight="400">A localised penetrating connection</text><text x="848" y="556" font-size="34" fill="#b56439" font-weight="700">χ × number → W/K</text><text x="848" y="612" font-size="27" fill="#203b42" font-weight="400">χ unit: W/K</text><text x="64" y="758" font-size="28" fill="#203b42" font-weight="700">Keep heat-loss coefficients separate from minimum interior surface temperatures.</text><path d="M64 816 L1536 816" fill="none" stroke="#becbc5" stroke-width="2"/><text x="64" y="855" font-size="22" fill="#53696d" font-weight="400">Values require assessment of the actual geometry. The diagrams are not thermal simulations.</text></g></svg>