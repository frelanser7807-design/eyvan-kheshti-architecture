<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc"><title id="title">Four layers meet at the balcony door</title><desc id="desc">Coordination map: review each function independently at the same junction. No sill height, membrane lap or drainage size is specified. Local requirements govern.</desc><rect width="1600" height="900" fill="#f3f2eb"/><g font-family="Arial, sans-serif"><text x="64" y="65" font-size="20" fill="#547f70" font-weight="700">WORLD ARCH JOURNAL / DESIGN NOTES</text><text x="64" y="132" font-size="44" fill="#203b42" font-weight="700">Four layers meet at the balcony door</text><text x="64" y="182" font-size="25" fill="#53696d" font-weight="400">Coordination map: review each function independently at the same junction.</text><rect x="64" y="236" width="1472" height="110" rx="12" fill="#fff" stroke="#c7d2ce" stroke-width="2"/><rect x="64" y="236" width="14" height="110" rx="0" fill="#467a95" stroke="#467a95" stroke-width="2"/><text x="104" y="279" font-size="27" fill="#467a95" font-weight="700">WATER CONTROL</text><text x="490" y="279" font-size="28" fill="#203b42" font-weight="400">Drainage, sill integration and exposure</text><text x="490" y="319" font-size="22" fill="#53696d" font-weight="400">Check the same coordinated threshold revision</text><rect x="64" y="366" width="1472" height="110" rx="12" fill="#fff" stroke="#c7d2ce" stroke-width="2"/><rect x="64" y="366" width="14" height="110" rx="0" fill="#796a91" stroke="#796a91" stroke-width="2"/><text x="104" y="409" font-size="27" fill="#796a91" font-weight="700">AIR CONTROL</text><text x="490" y="409" font-size="28" fill="#203b42" font-weight="400">Continuous connection to the door system</text><text x="490" y="449" font-size="22" fill="#53696d" font-weight="400">Check the same coordinated threshold revision</text><rect x="64" y="496" width="1472" height="110" rx="12" fill="#fff" stroke="#c7d2ce" stroke-width="2"/><rect x="64" y="496" width="14" height="110" rx="0" fill="#547f70" stroke="#547f70" stroke-width="2"/><text x="104" y="539" font-size="27" fill="#547f70" font-weight="700">THERMAL LAYER</text><text x="490" y="539" font-size="28" fill="#203b42" font-weight="400">Frame perimeter, slab edge and attachments</text><text x="490" y="579" font-size="22" fill="#53696d" font-weight="400">Check the same coordinated threshold revision</text><rect x="64" y="626" width="1472" height="110" rx="12" fill="#fff" stroke="#c7d2ce" stroke-width="2"/><rect x="64" y="626" width="14" height="110" rx="0" fill="#b56439" stroke="#b56439" stroke-width="2"/><text x="104" y="669" font-size="27" fill="#b56439" font-weight="700">LOAD PATH</text><text x="490" y="669" font-size="28" fill="#203b42" font-weight="400">Connection forces, tolerances and movement</text><text x="490" y="709" font-size="22" fill="#53696d" font-weight="400">Check the same coordinated threshold revision</text><path d="M64 816 L1536 816" fill="none" stroke="#becbc5" stroke-width="2"/><text x="64" y="855" font-size="22" fill="#53696d" font-weight="400">No sill height, membrane lap or drainage size is specified. Local requirements govern.</text></g></svg>