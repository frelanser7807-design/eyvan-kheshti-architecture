<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc"><title id="title">Make the slab edge traceable</title><desc id="desc">A junction register connects design intent to the construction evidence. Installation records support quality control; photographs alone do not establish a thermal value.</desc><rect width="1600" height="900" fill="#f3f2eb"/><g font-family="Arial, sans-serif"><text x="64" y="65" font-size="20" fill="#547f70" font-weight="700">WORLD ARCH JOURNAL / DESIGN NOTES</text><text x="64" y="132" font-size="44" fill="#203b42" font-weight="700">Make the slab edge traceable</text><text x="64" y="182" font-size="25" fill="#53696d" font-weight="400">A junction register connects design intent to the construction evidence.</text><rect x="64" y="255" width="350" height="435" rx="12" fill="#fff" stroke="#c7d2ce" stroke-width="2"/><text x="90" y="310" font-size="26" fill="#b56439" font-weight="700">01</text><text x="90" y="368" font-size="32" fill="#203b42" font-weight="700">DEFINE</text><text x="90" y="444" font-size="24" fill="#203b42" font-weight="400">Loads + climate</text><text x="90" y="512" font-size="24" fill="#203b42" font-weight="400">Enclosure position</text><text x="90" y="580" font-size="24" fill="#203b42" font-weight="400">Indoor assumptions</text><rect x="438" y="255" width="350" height="435" rx="12" fill="#fff" stroke="#c7d2ce" stroke-width="2"/><text x="464" y="310" font-size="26" fill="#b56439" font-weight="700">02</text><text x="464" y="368" font-size="32" fill="#203b42" font-weight="700">ASSESS</text><text x="464" y="444" font-size="24" fill="#203b42" font-weight="400">Junction geometry</text><text x="464" y="512" font-size="24" fill="#203b42" font-weight="400">Heat flow + surfaces</text><text x="464" y="580" font-size="24" fill="#203b42" font-weight="400">Water + air interfaces</text><rect x="812" y="255" width="350" height="435" rx="12" fill="#fff" stroke="#c7d2ce" stroke-width="2"/><text x="838" y="310" font-size="26" fill="#b56439" font-weight="700">03</text><text x="838" y="368" font-size="32" fill="#203b42" font-weight="700">VERIFY</text><text x="838" y="444" font-size="24" fill="#203b42" font-weight="400">Approved revision</text><text x="838" y="512" font-size="24" fill="#203b42" font-weight="400">Inspection records</text><text x="838" y="580" font-size="24" fill="#203b42" font-weight="400">Substitution review</text><rect x="1186" y="255" width="350" height="435" rx="12" fill="#fff" stroke="#c7d2ce" stroke-width="2"/><text x="1212" y="310" font-size="26" fill="#b56439" font-weight="700">04</text><text x="1212" y="368" font-size="32" fill="#203b42" font-weight="700">RETAIN</text><text x="1212" y="444" font-size="24" fill="#203b42" font-weight="400">As-built details</text><text x="1212" y="512" font-size="24" fill="#203b42" font-weight="400">Concealed-work record</text><text x="1212" y="580" font-size="24" fill="#203b42" font-weight="400">Maintenance duties</text><text x="64" y="756" font-size="28" fill="#203b42" font-weight="700">One junction identifier links the drawing, calculation, inspection and as-built record.</text><path d="M64 816 L1536 816" fill="none" stroke="#becbc5" stroke-width="2"/><text x="64" y="855" font-size="22" fill="#53696d" font-weight="400">Installation records support quality control; photographs alone do not establish a thermal value.</text></g></svg>