<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">Four layers of inclusive wayfinding</title><desc id="d">Nested bands organize spatial structure, landmarks, signs, and tactile, audible or digital support.</desc>
<rect width="1600" height="900" fill="#f3f2ed"/><text x="90" y="85" font-family="Arial" font-size="23" letter-spacing="5" fill="#897448">WAYFINDING SYSTEM / 01</text><text x="90" y="145" font-family="Arial" font-size="46" font-weight="700" fill="#20241f">FOUR LAYERS · ONE COHERENT JOURNEY</text>
<g transform="translate(800 500)"><circle r="300" fill="#dfe9df"/><circle r="238" fill="#c1d8d3"/><circle r="176" fill="#e7d8b9"/><circle r="112" fill="#b7c3de"/><circle r="52" fill="#344d60"/><text x="0" y="8" text-anchor="middle" font-family="Arial" font-size="18" fill="#fff">DESTINATION</text></g>
<g font-family="Arial" fill="#25352f"><path d="M800 200V260" stroke="#526f5d" stroke-width="3"/><text x="800" y="190" text-anchor="middle" font-size="23" font-weight="700">1 · SPATIAL STRUCTURE</text><text x="800" y="222" text-anchor="middle" font-size="17">Clear routes · readable zones · step-free access</text><path d="M1040 330 1000 365" stroke="#526f5d" stroke-width="3"/><text x="1065" y="304" font-size="22" font-weight="700">2 · LANDMARKS</text><text x="1065" y="335" font-size="17">Daylight · artwork · distinct thresholds</text><path d="M1045 640 995 610" stroke="#526f5d" stroke-width="3"/><text x="1070" y="670" font-size="22" font-weight="700">3 · VISUAL SIGNS</text><text x="1070" y="700" font-size="17">Orientation · direction · room identity</text><path d="M560 650 610 615" stroke="#526f5d" stroke-width="3"/><text x="95" y="682" font-size="22" font-weight="700">4 · REDUNDANT CHANNELS</text><text x="95" y="713" font-size="17">Tactile · audible · digital · human help</text><text x="90" y="820" font-size="18" fill="#657269">Not every feature fits every building. Select channels with users, access specialists and local standards.</text></g></svg>
