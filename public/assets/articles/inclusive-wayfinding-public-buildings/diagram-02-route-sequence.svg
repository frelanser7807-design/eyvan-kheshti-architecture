<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">Complete inclusive visitor journey</title><desc id="d">A public-building route connects arrival, orientation, main route, destination and return with choice points and a parallel step-free route.</desc>
<rect width="1600" height="900" fill="#f3f2ed"/><text x="90" y="85" font-family="Arial" font-size="23" letter-spacing="5" fill="#897448">JOURNEY MAP / 02</text><text x="90" y="145" font-family="Arial" font-size="46" font-weight="700" fill="#20241f">PLAN THE FULL TRIP, INCLUDING THE WAY BACK</text>
<path d="M150 420H1400" stroke="#577365" stroke-width="14" stroke-linecap="round"/><path d="M150 610H1400" stroke="#8c9bb4" stroke-width="9" stroke-dasharray="22 16" stroke-linecap="round"/><g fill="#d1ab5a" stroke="#fff" stroke-width="8"><circle cx="200" cy="420" r="29"/><circle cx="490" cy="420" r="29"/><circle cx="780" cy="420" r="29"/><circle cx="1080" cy="420" r="29"/><circle cx="1375" cy="420" r="29"/></g><g font-family="Arial" fill="#273730" text-anchor="middle"><text x="200" y="335" font-size="23" font-weight="700">ARRIVE</text><text x="200" y="370" font-size="18">Street / transit</text><text x="490" y="335" font-size="23" font-weight="700">ORIENT</text><text x="490" y="370" font-size="18">Welcome point + map</text><text x="780" y="335" font-size="23" font-weight="700">CHOOSE</text><text x="780" y="370" font-size="18">Visible route decision</text><text x="1080" y="335" font-size="23" font-weight="700">ARRIVE</text><text x="1080" y="370" font-size="18">Destination ID</text><text x="1375" y="335" font-size="23" font-weight="700">RETURN</text><text x="1375" y="370" font-size="18">Way back is legible</text></g>
<g stroke="#c75a45" stroke-width="4" stroke-dasharray="9 7"><path d="M780 420v135"/><path d="M1080 420v135"/></g><g font-family="Arial" fill="#a14739" text-anchor="middle"><text x="780" y="530" font-size="18" font-weight="700">DECISION POINT</text><text x="1080" y="530" font-size="18" font-weight="700">PAUSE / SEATING</text></g><text x="800" y="666" font-family="Arial" font-size="22" font-weight="700" fill="#485b7a" text-anchor="middle">STEP-FREE ROUTE · SHARED DESTINATIONS · NO HIDDEN DETOUR</text><text x="90" y="820" font-family="Arial" font-size="18" fill="#657269">Schematic only · Confirm dimensions, gradients, clearances, egress and tactile cues against the current local standard.</text></svg>
