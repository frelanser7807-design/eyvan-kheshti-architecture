<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">Wayfinding sign hierarchy at three moments</title><desc id="d">Three examples show a building orientation map on arrival, a directional sign at a choice point, and a room identification sign at the destination.</desc>
<rect width="1600" height="900" fill="#f3f2ed"/><text x="90" y="85" font-family="Arial" font-size="23" letter-spacing="5" fill="#897448">INFORMATION HIERARCHY / 03</text><text x="90" y="145" font-family="Arial" font-size="46" font-weight="700" fill="#20241f">PUT THE RIGHT INFORMATION AT THE RIGHT MOMENT</text>
<g transform="translate(90 230)"><rect width="430" height="480" rx="18" fill="#fff" stroke="#d7d7ce" stroke-width="3"/><circle cx="75" cy="74" r="34" fill="#354d5a"/><text x="75" y="83" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#fff">1</text><text x="130" y="85" font-family="Arial" font-size="23" font-weight="700" fill="#2b3e36">ARRIVAL</text><rect x="62" y="145" width="305" height="225" fill="#f0ede4" stroke="#728d7d" stroke-width="4"/><path d="M105 190h80v40h90v50h42M135 325v-70h-25" fill="none" stroke="#5e7f68" stroke-width="14" stroke-linecap="round"/><circle cx="105" cy="190" r="13" fill="#bb8a3c"/><text x="215" y="415" text-anchor="middle" font-family="Arial" font-size="18" fill="#44544b">ORIENTATION MAP · YOU ARE HERE</text></g>
<g transform="translate(585 230)"><rect width="430" height="480" rx="18" fill="#fff" stroke="#d7d7ce" stroke-width="3"/><circle cx="75" cy="74" r="34" fill="#354d5a"/><text x="75" y="83" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#fff">2</text><text x="130" y="85" font-family="Arial" font-size="23" font-weight="700" fill="#2b3e36">CHOICE POINT</text><rect x="84" y="170" width="265" height="150" rx="9" fill="#314c56"/><path d="M140 230h115m0 0-24-20m24 20-24 20M140 275h75m0 0-22-18m22 18-22 18" stroke="#fff" stroke-width="9" fill="none" stroke-linecap="round"/><text x="218" y="367" text-anchor="middle" font-family="Arial" font-size="18" fill="#44544b">DIRECTION BEFORE THE TURN</text></g>
<g transform="translate(1080 230)"><rect width="430" height="480" rx="18" fill="#fff" stroke="#d7d7ce" stroke-width="3"/><circle cx="75" cy="74" r="34" fill="#354d5a"/><text x="75" y="83" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#fff">3</text><text x="130" y="85" font-family="Arial" font-size="23" font-weight="700" fill="#2b3e36">DESTINATION</text><rect x="98" y="170" width="235" height="154" rx="9" fill="#f5f4ed" stroke="#314c56" stroke-width="5"/><text x="215" y="225" text-anchor="middle" font-family="Arial" font-size="29" font-weight="700" fill="#263d49">ROOM 204</text><text x="215" y="270" text-anchor="middle" font-family="Arial" font-size="20" fill="#263d49">COMMUNITY ROOM</text><g fill="#263d49"><circle cx="152" cy="294" r="4"/><circle cx="170" cy="294" r="4"/><circle cx="188" cy="294" r="4"/><circle cx="206" cy="294" r="4"/><circle cx="224" cy="294" r="4"/><circle cx="242" cy="294" r="4"/></g><text x="215" y="367" text-anchor="middle" font-family="Arial" font-size="18" fill="#44544b">TACTILE / BRAILLE AS REQUIRED</text></g>
<text x="90" y="810" font-family="Arial" font-size="18" fill="#657269">Illustrative examples · Sign type and tactile requirements vary by jurisdiction. Check current accessibility and life-safety standards.</text></svg>
