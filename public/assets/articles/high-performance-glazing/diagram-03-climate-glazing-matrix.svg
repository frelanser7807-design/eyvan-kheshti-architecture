<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Climate and orientation glazing decision matrix</title>
  <desc id="desc">Conceptual matrix showing how priorities change between heating-dominated and cooling-dominated climates and different orientations.</desc>
  <rect width="1600" height="900" fill="#f3efe7"/>
  <text x="100" y="105" fill="#101820" font-family="Georgia,serif" font-size="60">Climate first. Product second.</text>
  <text x="100" y="155" fill="#786d61" font-family="Arial,sans-serif" font-size="22" letter-spacing="4">CONCEPTUAL PRIORITY MATRIX · VERIFY WITH LOCAL MODELLING</text>
  <g transform="translate(260 240)" font-family="Arial,sans-serif">
    <rect width="1080" height="500" fill="#fff" stroke="#101820" stroke-width="4"/>
    <path d="M0 125h1080M0 250h1080M0 375h1080M270 0v500M540 0v500M810 0v500" stroke="#b7aea1" stroke-width="2"/>
    <g fill="#101820" font-size="24" font-weight="700" text-anchor="middle"><text x="135" y="-28">NORTH / LOW SUN</text><text x="405" y="-28">EAST</text><text x="675" y="-28">SOUTH</text><text x="945" y="-28">WEST</text></g>
    <g fill="#fff" font-size="24" font-weight="700" text-anchor="middle"><rect x="-190" y="0" width="190" height="125" fill="#173244"/><text x="-95" y="55">HEATING</text><text x="-95" y="87">DOMINATED</text><rect x="-190" y="125" width="190" height="125" fill="#28556b"/><text x="-95" y="180">MIXED</text><text x="-95" y="212">COLD</text><rect x="-190" y="250" width="190" height="125" fill="#b6793e"/><text x="-95" y="305">MIXED</text><text x="-95" y="337">HOT</text><rect x="-190" y="375" width="190" height="125" fill="#8b442d"/><text x="-95" y="430">COOLING</text><text x="-95" y="462">DOMINATED</text></g>
    <g fill="#101820" font-size="22" text-anchor="middle">
      <text x="135" y="58">Low U-factor</text><text x="135" y="90">Comfort at glass</text><text x="405" y="58">Low U-factor</text><text x="405" y="90">Morning glare check</text><text x="675" y="58">Low U-factor</text><text x="675" y="90">Useful winter gain*</text><text x="945" y="58">Low U-factor</text><text x="945" y="90">Late glare control</text>
      <text x="135" y="183">Balanced U / VT</text><text x="135" y="215">Air leakage</text><text x="405" y="183">Moderate SHGC</text><text x="405" y="215">Operable shade</text><text x="675" y="183">Seasonal shade</text><text x="675" y="215">Daylight depth</text><text x="945" y="183">Lower SHGC</text><text x="945" y="215">Exterior control</text>
      <text x="135" y="308">Daylight / glare</text><text x="135" y="340">Moderate SHGC</text><text x="405" y="308">Lower SHGC</text><text x="405" y="340">Morning control</text><text x="675" y="308">Low SHGC</text><text x="675" y="340">Fixed shade</text><text x="945" y="308">Very low SHGC</text><text x="945" y="340">Dynamic control</text>
      <text x="135" y="433">VT without glare</text><text x="135" y="465">Air tightness</text><text x="405" y="433">Low SHGC</text><text x="405" y="465">Exterior shade</text><text x="675" y="433">Low SHGC</text><text x="675" y="465">Overhang + controls</text><text x="945" y="433">Lowest useful SHGC</text><text x="945" y="465">Limit glass area</text>
    </g>
  </g>
  <text x="100" y="820" fill="#101820" font-family="Arial,sans-serif" font-size="24">* Solar gain is useful only when the building can use it without creating glare or overheating. Orientation labels vary by hemisphere.</text>
</svg>
