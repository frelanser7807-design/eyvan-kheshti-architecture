<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Four window metrics architects must read together</title>
  <desc id="desc">Editorial diagram comparing U-factor, solar heat gain coefficient, visible transmittance and air leakage.</desc>
  <rect width="1600" height="900" fill="#f3efe7"/>
  <text x="110" y="115" fill="#101820" font-family="Georgia,serif" font-size="60">Read the whole window, not one number</text>
  <text x="110" y="165" fill="#6f655a" font-family="Arial,sans-serif" font-size="22" letter-spacing="4">FOUR PERFORMANCE METRICS · ORIGINAL EDITORIAL DIAGRAM</text>
  <g font-family="Arial,sans-serif">
    <g transform="translate(110 250)"><rect width="310" height="430" rx="24" fill="#101820"/><circle cx="155" cy="108" r="65" fill="none" stroke="#c89550" stroke-width="8"/><path d="M155 53v110M100 108h110" stroke="#c89550" stroke-width="8"/><text x="28" y="230" fill="#fff" font-size="36" font-weight="700">U-FACTOR</text><text x="28" y="280" fill="#dfc9a4" font-size="22">Heat flow through the</text><text x="28" y="312" fill="#dfc9a4" font-size="22">complete assembly</text><text x="28" y="382" fill="#fff" font-size="24">Lower usually insulates</text><text x="28" y="414" fill="#fff" font-size="24">better.</text></g>
    <g transform="translate(465 250)"><rect width="310" height="430" rx="24" fill="#fff" stroke="#c89550" stroke-width="3"/><circle cx="155" cy="108" r="65" fill="none" stroke="#c89550" stroke-width="8"/><circle cx="155" cy="108" r="24" fill="#c89550"/><path d="M155 22v38M155 156v38M69 108h38M203 108h38" stroke="#c89550" stroke-width="8"/><text x="28" y="230" fill="#101820" font-size="36" font-weight="700">SHGC</text><text x="28" y="280" fill="#6f655a" font-size="22">Solar heat admitted</text><text x="28" y="312" fill="#6f655a" font-size="22">through glass + frame</text><text x="28" y="382" fill="#101820" font-size="24">Right value depends on</text><text x="28" y="414" fill="#101820" font-size="24">climate and orientation.</text></g>
    <g transform="translate(820 250)"><rect width="310" height="430" rx="24" fill="#101820"/><circle cx="155" cy="108" r="65" fill="none" stroke="#c89550" stroke-width="8"/><path d="M98 108h114M155 51v114" stroke="#c89550" stroke-width="8"/><circle cx="155" cy="108" r="18" fill="#f3efe7"/><text x="28" y="230" fill="#fff" font-size="36" font-weight="700">VT</text><text x="28" y="280" fill="#dfc9a4" font-size="22">Visible daylight</text><text x="28" y="312" fill="#dfc9a4" font-size="22">through the product</text><text x="28" y="382" fill="#fff" font-size="24">More light can also mean</text><text x="28" y="414" fill="#fff" font-size="24">more glare to control.</text></g>
    <g transform="translate(1175 250)"><rect width="310" height="430" rx="24" fill="#fff" stroke="#c89550" stroke-width="3"/><circle cx="155" cy="108" r="65" fill="none" stroke="#c89550" stroke-width="8"/><path d="M92 108h126M184 77l34 31-34 31" fill="none" stroke="#c89550" stroke-width="8"/><text x="28" y="230" fill="#101820" font-size="36" font-weight="700">AIR</text><text x="28" y="280" fill="#6f655a" font-size="22">Leakage through joints</text><text x="28" y="312" fill="#6f655a" font-size="22">and operable edges</text><text x="28" y="382" fill="#101820" font-size="24">Glass cannot rescue a</text><text x="28" y="414" fill="#101820" font-size="24">poor frame or install.</text></g>
  </g>
  <path d="M110 755h1375" stroke="#c89550" stroke-width="3"/>
  <text x="110" y="815" fill="#101820" font-family="Arial,sans-serif" font-size="28">Specify certified whole-product data, then test orientation, shading, frame, edge and installation as one system.</text>
</svg>
