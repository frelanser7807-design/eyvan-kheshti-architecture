<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Low-carbon concrete procurement workflow</title>
  <desc id="desc">Seven project gates from structural efficiency to verified delivery records.</desc>
  <rect width="1600" height="900" fill="#0d151c"/>
  <text x="100" y="105" fill="#fff" font-family="Georgia,serif" font-size="58">From ambition to delivered concrete</text>
  <text x="100" y="155" fill="#c89550" font-family="Arial,sans-serif" font-size="22" letter-spacing="4">SEVEN PROCUREMENT GATES</text>
  <path d="M165 465H1435" stroke="#c89550" stroke-width="6"/>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <g transform="translate(165 465)"><circle r="68" fill="#f3efe7" stroke="#c89550" stroke-width="7"/><text y="12" font-size="36" fill="#101820">01</text><text y="120" fill="#fff" font-size="22">BUILD LESS</text><text y="153" fill="#bfb3a3" font-size="18">efficient structure</text></g>
    <g transform="translate(375 465)"><circle r="68" fill="#101820" stroke="#c89550" stroke-width="7"/><text y="12" font-size="36" fill="#fff">02</text><text y="120" fill="#fff" font-size="22">SET TARGET</text><text y="153" fill="#bfb3a3" font-size="18">baseline + limit</text></g>
    <g transform="translate(585 465)"><circle r="68" fill="#f3efe7" stroke="#c89550" stroke-width="7"/><text y="12" font-size="36" fill="#101820">03</text><text y="120" fill="#fff" font-size="22">ENGAGE EARLY</text><text y="153" fill="#bfb3a3" font-size="18">supplier + engineer</text></g>
    <g transform="translate(795 465)"><circle r="68" fill="#101820" stroke="#c89550" stroke-width="7"/><text y="12" font-size="36" fill="#fff">04</text><text y="120" fill="#fff" font-size="22">ASK FOR EPD</text><text y="153" fill="#bfb3a3" font-size="18">verified + current</text></g>
    <g transform="translate(1005 465)"><circle r="68" fill="#f3efe7" stroke="#c89550" stroke-width="7"/><text y="12" font-size="36" fill="#101820">05</text><text y="120" fill="#fff" font-size="22">TEST MIX</text><text y="153" fill="#bfb3a3" font-size="18">programme + quality</text></g>
    <g transform="translate(1215 465)"><circle r="68" fill="#101820" stroke="#c89550" stroke-width="7"/><text y="12" font-size="36" fill="#fff">06</text><text y="120" fill="#fff" font-size="22">CONTROL CHANGE</text><text y="153" fill="#bfb3a3" font-size="18">approved alternatives</text></g>
    <g transform="translate(1435 465)"><circle r="68" fill="#f3efe7" stroke="#c89550" stroke-width="7"/><text y="12" font-size="36" fill="#101820">07</text><text y="120" fill="#fff" font-size="22">VERIFY</text><text y="153" fill="#bfb3a3" font-size="18">tickets + final data</text></g>
  </g>
  <rect x="100" y="710" width="1400" height="92" rx="46" fill="#c89550"/>
  <text x="800" y="768" fill="#101820" font-family="Arial,sans-serif" font-size="27" font-weight="700" text-anchor="middle">Do not specify a marketing label. Specify a measurable outcome and a documented route to it.</text>
</svg>
