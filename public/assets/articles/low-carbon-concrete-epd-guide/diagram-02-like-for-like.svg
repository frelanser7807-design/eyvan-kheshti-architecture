<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Like-for-like concrete EPD comparison matrix</title>
  <desc id="desc">Seven checks for comparing concrete environmental product declarations fairly.</desc>
  <rect width="1600" height="900" fill="#f3efe7"/>
  <text x="100" y="105" fill="#101820" font-family="Georgia,serif" font-size="58">Seven checks before “lower carbon”</text>
  <text x="100" y="155" fill="#a56f2d" font-family="Arial,sans-serif" font-size="22" letter-spacing="4">LIKE-FOR-LIKE OR NOT COMPARABLE</text>
  <g font-family="Arial,sans-serif">
    <g transform="translate(100 235)"><rect width="660" height="120" rx="24" fill="#101820"/><circle cx="65" cy="60" r="34" fill="#c89550"/><text x="65" y="72" text-anchor="middle" font-size="30" fill="#101820" font-weight="700">1</text><text x="125" y="52" font-size="27" fill="#fff" font-weight="700">Declared unit</text><text x="125" y="87" font-size="21" fill="#c7c0b7">m³, tonne or another stated basis?</text></g>
    <g transform="translate(840 235)"><rect width="660" height="120" rx="24" fill="#101820"/><circle cx="65" cy="60" r="34" fill="#c89550"/><text x="65" y="72" text-anchor="middle" font-size="30" fill="#101820" font-weight="700">2</text><text x="125" y="52" font-size="27" fill="#fff" font-weight="700">Strength + performance</text><text x="125" y="87" font-size="21" fill="#c7c0b7">Same structural and durability brief?</text></g>
    <g transform="translate(100 385)"><rect width="660" height="120" rx="24" fill="#17242d"/><circle cx="65" cy="60" r="34" fill="#c89550"/><text x="65" y="72" text-anchor="middle" font-size="30" fill="#101820" font-weight="700">3</text><text x="125" y="52" font-size="27" fill="#fff" font-weight="700">Life-cycle modules</text><text x="125" y="87" font-size="21" fill="#c7c0b7">A1–A3 alone, or more stages?</text></g>
    <g transform="translate(840 385)"><rect width="660" height="120" rx="24" fill="#17242d"/><circle cx="65" cy="60" r="34" fill="#c89550"/><text x="65" y="72" text-anchor="middle" font-size="30" fill="#101820" font-weight="700">4</text><text x="125" y="52" font-size="27" fill="#fff" font-weight="700">Geography + plant</text><text x="125" y="87" font-size="21" fill="#c7c0b7">Representative of the supply route?</text></g>
    <g transform="translate(100 535)"><rect width="660" height="120" rx="24" fill="#101820"/><circle cx="65" cy="60" r="34" fill="#c89550"/><text x="65" y="72" text-anchor="middle" font-size="30" fill="#101820" font-weight="700">5</text><text x="125" y="52" font-size="27" fill="#fff" font-weight="700">Data period + validity</text><text x="125" y="87" font-size="21" fill="#c7c0b7">Current and independently verified?</text></g>
    <g transform="translate(840 535)"><rect width="660" height="120" rx="24" fill="#101820"/><circle cx="65" cy="60" r="34" fill="#c89550"/><text x="65" y="72" text-anchor="middle" font-size="30" fill="#101820" font-weight="700">6</text><text x="125" y="52" font-size="27" fill="#fff" font-weight="700">PCR + standard</text><text x="125" y="87" font-size="21" fill="#c7c0b7">Same rules and calculation basis?</text></g>
    <g transform="translate(470 685)"><rect width="660" height="120" rx="24" fill="#c89550"/><circle cx="65" cy="60" r="34" fill="#101820"/><text x="65" y="72" text-anchor="middle" font-size="30" fill="#fff" font-weight="700">7</text><text x="125" y="52" font-size="27" fill="#101820" font-weight="700">Structure-level outcome</text><text x="125" y="87" font-size="21" fill="#27343d">Does the design use less material overall?</text></g>
  </g>
</svg>
