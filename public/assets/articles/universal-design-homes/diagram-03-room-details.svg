<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Universal design details by room</title>
  <desc id="desc">Four-room checklist for entrance, kitchen, bathroom and bedroom.</desc>
  <rect width="1600" height="900" fill="#f3efe7"/>
  <text x="105" y="110" fill="#101820" font-family="Georgia,serif" font-size="60">Details should disappear into daily life</text>
  <text x="105" y="160" fill="#756a5e" font-family="Arial,sans-serif" font-size="22" letter-spacing="4">FOUR ROOMS · TWELVE QUIET DECISIONS</text>
  <g font-family="Arial,sans-serif">
    <g transform="translate(105 245)"><rect width="330" height="475" rx="24" fill="#101820"/><text x="30" y="65" fill="#c89550" font-size="34" font-weight="700">ENTRANCE</text><path d="M40 125h250v150H40zM75 160h70v115" fill="none" stroke="#fff" stroke-width="8"/><circle cx="132" cy="213" r="8" fill="#c89550"/><text x="30" y="335" fill="#fff" font-size="24">• level approach</text><text x="30" y="377" fill="#fff" font-size="24">• shelter + resting ledge</text><text x="30" y="419" fill="#fff" font-size="24">• obvious, easy hardware</text></g>
    <g transform="translate(460 245)"><rect width="330" height="475" rx="24" fill="#fff" stroke="#c89550" stroke-width="3"/><text x="30" y="65" fill="#101820" font-size="34" font-weight="700">KITCHEN</text><path d="M45 125h240v145H45zM85 125v145M220 125v145M45 205h240" fill="none" stroke="#101820" stroke-width="8"/><text x="30" y="335" fill="#101820" font-size="24">• varied work heights</text><text x="30" y="377" fill="#101820" font-size="24">• reachable storage</text><text x="30" y="419" fill="#101820" font-size="24">• glare-free task light</text></g>
    <g transform="translate(815 245)"><rect width="330" height="475" rx="24" fill="#101820"/><text x="30" y="65" fill="#c89550" font-size="34" font-weight="700">BATHROOM</text><path d="M55 145h220v125H55zM78 125v165M230 125v165" fill="none" stroke="#fff" stroke-width="8"/><path d="M110 180h110" stroke="#c89550" stroke-width="12"/><text x="30" y="335" fill="#fff" font-size="24">• level shower zone</text><text x="30" y="377" fill="#fff" font-size="24">• support-ready walls</text><text x="30" y="419" fill="#fff" font-size="24">• slip + contrast control</text></g>
    <g transform="translate(1170 245)"><rect width="330" height="475" rx="24" fill="#fff" stroke="#c89550" stroke-width="3"/><text x="30" y="65" fill="#101820" font-size="34" font-weight="700">BEDROOM</text><rect x="60" y="155" width="210" height="115" fill="none" stroke="#101820" stroke-width="8"/><path d="M60 205h210M100 155v50" stroke="#101820" stroke-width="8"/><text x="30" y="335" fill="#101820" font-size="24">• clear bed approach</text><text x="30" y="377" fill="#101820" font-size="24">• two-way controls</text><text x="30" y="419" fill="#101820" font-size="24">• adaptable storage</text></g>
  </g>
  <text x="105" y="815" fill="#101820" font-family="Arial,sans-serif" font-size="27">Good universal design supports independence without announcing itself as special equipment.</text>
</svg>
