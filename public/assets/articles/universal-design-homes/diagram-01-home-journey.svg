<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">The continuous accessible journey through a home</title>
  <desc id="desc">Diagram tracing a step-free route from street and parking through entry, living spaces, bathroom, bedroom and garden.</desc>
  <rect width="1600" height="900" fill="#f3efe7"/>
  <text x="100" y="110" fill="#101820" font-family="Georgia,serif" font-size="60">Design one continuous journey</text>
  <text x="100" y="160" fill="#756a5e" font-family="Arial,sans-serif" font-size="22" letter-spacing="4">FROM ARRIVAL TO EVERYDAY LIFE · ORIGINAL EDITORIAL DIAGRAM</text>
  <path d="M155 510 C280 300 390 710 520 480 S760 270 880 500 S1120 710 1240 470 S1400 310 1470 430" fill="none" stroke="#c89550" stroke-width="18" stroke-linecap="round"/>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <g transform="translate(155 510)"><circle r="72" fill="#101820"/><text y="12" fill="#fff" font-size="34">01</text><text y="120" fill="#101820" font-size="25" font-weight="700">STREET / PARKING</text><text y="152" fill="#6f655a" font-size="20">safe arrival + weather</text></g>
    <g transform="translate(420 545)"><circle r="72" fill="#fff" stroke="#101820" stroke-width="5"/><text y="12" fill="#101820" font-size="34">02</text><text y="120" fill="#101820" font-size="25" font-weight="700">ENTRANCE</text><text y="152" fill="#6f655a" font-size="20">level threshold + rest</text></g>
    <g transform="translate(680 385)"><circle r="72" fill="#101820"/><text y="12" fill="#fff" font-size="34">03</text><text y="120" fill="#101820" font-size="25" font-weight="700">LIVING</text><text y="152" fill="#6f655a" font-size="20">clear choices + daylight</text></g>
    <g transform="translate(945 555)"><circle r="72" fill="#fff" stroke="#101820" stroke-width="5"/><text y="12" fill="#101820" font-size="34">04</text><text y="120" fill="#101820" font-size="25" font-weight="700">BATHROOM</text><text y="152" fill="#6f655a" font-size="20">future support + dignity</text></g>
    <g transform="translate(1210 505)"><circle r="72" fill="#101820"/><text y="12" fill="#fff" font-size="34">05</text><text y="120" fill="#101820" font-size="25" font-weight="700">BEDROOM</text><text y="152" fill="#6f655a" font-size="20">bed clearance + storage</text></g>
    <g transform="translate(1470 430)"><circle r="72" fill="#fff" stroke="#101820" stroke-width="5"/><text y="12" fill="#101820" font-size="34">06</text><text y="120" fill="#101820" font-size="25" font-weight="700">OUTDOORS</text><text y="152" fill="#6f655a" font-size="20">flush access + shade</text></g>
  </g>
  <text x="100" y="820" fill="#101820" font-family="Arial,sans-serif" font-size="28">A single inaccessible link can cancel the value of every well-designed room beyond it.</text>
</svg>
