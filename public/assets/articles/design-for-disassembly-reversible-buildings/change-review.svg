<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc"><title id="title">Review one bay, then test an awkward one</title><desc id="desc">Design questions for future change: use a corner or service interface as a second test. A review framework, not dismantling instructions or a claim that the illustrated parts are reusable.</desc><rect width="1600" height="900" fill="#f3f2eb"/><g font-family="Arial, sans-serif"><text x="64" y="65" font-size="20" fill="#547f70" font-weight="700">WORLD ARCH JOURNAL / DESIGN NOTES</text><text x="64" y="132" font-size="44" fill="#203b42" font-weight="700">Review one bay, then test an awkward one</text><text x="64" y="182" font-size="25" fill="#53696d" font-weight="400">Design questions for future change: use a corner or service interface as a second test.</text><rect x="64" y="240" width="1472" height="150" rx="12" fill="#fff" stroke="#c7d2ce" stroke-width="2"/><text x="94" y="284" font-size="27" fill="#547f70" font-weight="700">CHANGE THE FIT-OUT</text><text x="94" y="334" font-size="30" fill="#203b42" font-weight="400">What can move inside the bay?</text><text x="815" y="334" font-size="25" fill="#203b42" font-weight="400">Record service zones + required separations</text><rect x="64" y="416" width="1472" height="150" rx="12" fill="#fff" stroke="#c7d2ce" stroke-width="2"/><text x="94" y="460" font-size="27" fill="#547f70" font-weight="700">REPLACE THE ENCLOSURE</text><text x="94" y="510" font-size="30" fill="#203b42" font-weight="400">Can one panel be reached?</text><text x="815" y="510" font-size="25" fill="#203b42" font-weight="400">Record access + weather-control interfaces</text><rect x="64" y="592" width="1472" height="150" rx="12" fill="#fff" stroke="#c7d2ce" stroke-width="2"/><text x="94" y="636" font-size="27" fill="#547f70" font-weight="700">ASSESS COMPONENT RECOVERY</text><text x="94" y="686" font-size="30" fill="#203b42" font-weight="400">What must be reviewed before reuse?</text><text x="815" y="686" font-size="25" fill="#203b42" font-weight="400">Record condition + structural dependencies</text><path d="M64 816 L1536 816" fill="none" stroke="#becbc5" stroke-width="2"/><text x="64" y="855" font-size="22" fill="#53696d" font-weight="400">A review framework, not dismantling instructions or a claim that the illustrated parts are reusable.</text></g></svg>