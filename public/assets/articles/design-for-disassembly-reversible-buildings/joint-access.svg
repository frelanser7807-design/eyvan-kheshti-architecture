<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc"><title id="title">The joint includes the space around it</title><desc id="desc">Generic interface sketches: no material is assigned a universal recovery rating. Not an engineered connection detail. Temporary support and any removal need professional design.</desc><rect width="1600" height="900" fill="#f3f2eb"/><g font-family="Arial, sans-serif"><text x="64" y="65" font-size="20" fill="#547f70" font-weight="700">WORLD ARCH JOURNAL / DESIGN NOTES</text><text x="64" y="132" font-size="44" fill="#203b42" font-weight="700">The joint includes the space around it</text><text x="64" y="182" font-size="25" fill="#53696d" font-weight="400">Generic interface sketches: no material is assigned a universal recovery rating.</text><rect x="64" y="236" width="720" height="490" rx="12" fill="#fff" stroke="#c7d2ce" stroke-width="2"/><rect x="812" y="236" width="724" height="490" rx="12" fill="#fff" stroke="#c7d2ce" stroke-width="2"/><text x="96" y="294" font-size="28" fill="#547f70" font-weight="700">ACCESSIBLE MECHANICAL JOINT</text><text x="844" y="294" font-size="28" fill="#b56439" font-weight="700">CONTINUOUS BONDED INTERFACE</text><rect x="118" y="390" width="242" height="72" rx="0" fill="#c0a17b" stroke="#c0a17b" stroke-width="2"/><rect x="370" y="390" width="242" height="72" rx="0" fill="#c0a17b" stroke="#c0a17b" stroke-width="2"/><rect x="868" y="390" width="242" height="72" rx="0" fill="#c0a17b" stroke="#c0a17b" stroke-width="2"/><rect x="1120" y="390" width="242" height="72" rx="0" fill="#c0a17b" stroke="#c0a17b" stroke-width="2"/><rect x="282" y="358" width="170" height="134" rx="0" fill="#9baaa6" stroke="#203b42" stroke-width="2"/><circle cx="308" cy="425" r="13" fill="#203b42"/><circle cx="418" cy="425" r="13" fill="#203b42"/><path d="M308 316 L308 393" fill="none" stroke="#547f70" stroke-width="3"/><text x="104" y="560" font-size="27" fill="#203b42" font-weight="400">Access must survive later finishes.</text><text x="104" y="615" font-size="26" fill="#203b42" font-weight="400">Record fasteners and dependencies.</text><rect x="1103" y="390" width="18" height="72" rx="0" fill="#b56439" stroke="#b56439" stroke-width="2"/><text x="844" y="560" font-size="27" fill="#203b42" font-weight="400">Define a credible separation method.</text><text x="844" y="615" font-size="26" fill="#203b42" font-weight="400">Check damage and residue constraints.</text><text x="64" y="776" font-size="25" fill="#203b42" font-weight="700">A bolt alone does not prove reversibility; a bonded joint needs an explicit recovery review.</text><path d="M64 816 L1536 816" fill="none" stroke="#becbc5" stroke-width="2"/><text x="64" y="855" font-size="22" fill="#53696d" font-weight="400">Not an engineered connection detail. Temporary support and any removal need professional design.</text></g></svg>