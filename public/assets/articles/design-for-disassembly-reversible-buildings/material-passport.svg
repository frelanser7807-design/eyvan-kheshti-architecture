<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc"><title id="title">A passport must point to something real</title><desc id="desc">Keep facts, assumptions and unknowns distinguishable in the component record. A record supports assessment. It does not certify future condition, structural capacity or market demand.</desc><rect width="1600" height="900" fill="#f3f2eb"/><g font-family="Arial, sans-serif"><text x="64" y="65" font-size="20" fill="#547f70" font-weight="700">WORLD ARCH JOURNAL / DESIGN NOTES</text><text x="64" y="132" font-size="44" fill="#203b42" font-weight="700">A passport must point to something real</text><text x="64" y="182" font-size="25" fill="#53696d" font-weight="400">Keep facts, assumptions and unknowns distinguishable in the component record.</text><rect x="64" y="238" width="420" height="515" rx="12" fill="#fff" stroke="#c7d2ce" stroke-width="2"/><text x="96" y="291" font-size="25" fill="#547f70" font-weight="700">COMPONENT ID</text><text x="96" y="354" font-size="36" fill="#203b42" font-weight="700">PANEL / F-023</text><text x="96" y="420" font-size="25" fill="#203b42" font-weight="400">Location on as-built plan</text><text x="96" y="476" font-size="25" fill="#203b42" font-weight="400">Link to owner-held register</text><text x="96" y="532" font-size="25" fill="#203b42" font-weight="400">Source + revision date</text><text x="96" y="631" font-size="27" fill="#203b42" font-weight="700">Identity must match</text><text x="96" y="672" font-size="27" fill="#203b42" font-weight="700">the installed component.</text><rect x="532" y="238" width="1004" height="110" rx="12" fill="#fff" stroke="#c7d2ce" stroke-width="2"/><text x="562" y="281" font-size="25" fill="#547f70" font-weight="700">PRODUCT</text><text x="562" y="322" font-size="27" fill="#203b42" font-weight="400">Reference, dimensions, composition</text><rect x="532" y="370" width="1004" height="110" rx="12" fill="#fff" stroke="#c7d2ce" stroke-width="2"/><text x="562" y="413" font-size="25" fill="#547f70" font-weight="700">INTERFACES</text><text x="562" y="454" font-size="27" fill="#203b42" font-weight="400">Connection + access requirements</text><rect x="532" y="502" width="1004" height="110" rx="12" fill="#fff" stroke="#c7d2ce" stroke-width="2"/><text x="562" y="545" font-size="25" fill="#547f70" font-weight="700">EVIDENCE</text><text x="562" y="586" font-size="27" fill="#203b42" font-weight="400">Technical records + known limits</text><rect x="532" y="634" width="1004" height="110" rx="12" fill="#fff" stroke="#c7d2ce" stroke-width="2"/><text x="562" y="677" font-size="25" fill="#547f70" font-weight="700">HISTORY</text><text x="562" y="718" font-size="27" fill="#203b42" font-weight="400">Installation, inspections, replacements</text><path d="M64 816 L1536 816" fill="none" stroke="#becbc5" stroke-width="2"/><text x="64" y="855" font-size="22" fill="#53696d" font-weight="400">A record supports assessment. It does not certify future condition, structural capacity or market demand.</text></g></svg>