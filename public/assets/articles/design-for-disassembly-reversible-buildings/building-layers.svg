<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc"><title id="title">Different layers, different reasons to change</title><desc id="desc">Separate systems without losing structure, fire, acoustic or weather performance. Conceptual layers, not an installation sequence. All interfaces still require coordination.</desc><rect width="1600" height="900" fill="#f3f2eb"/><g font-family="Arial, sans-serif"><text x="64" y="65" font-size="20" fill="#547f70" font-weight="700">WORLD ARCH JOURNAL / DESIGN NOTES</text><text x="64" y="132" font-size="44" fill="#203b42" font-weight="700">Different layers, different reasons to change</text><text x="64" y="182" font-size="25" fill="#53696d" font-weight="400">Separate systems without losing structure, fire, acoustic or weather performance.</text><rect x="64" y="240" width="1472" height="110" rx="12" fill="#fff" stroke="#c7d2ce" stroke-width="2"/><rect x="88" y="262" width="44" height="66" rx="4" fill="#203b42" stroke="#203b42" stroke-width="2"/><text x="164" y="306" font-size="31" fill="#203b42" font-weight="700">STRUCTURE</text><text x="570" y="306" font-size="29" fill="#203b42" font-weight="400">Keep the primary frame legible</text><rect x="64" y="370" width="1472" height="110" rx="12" fill="#fff" stroke="#c7d2ce" stroke-width="2"/><rect x="88" y="392" width="44" height="66" rx="4" fill="#547f70" stroke="#547f70" stroke-width="2"/><text x="164" y="436" font-size="31" fill="#547f70" font-weight="700">ENCLOSURE</text><text x="570" y="436" font-size="29" fill="#203b42" font-weight="400">Plan access for local replacement</text><rect x="64" y="500" width="1472" height="110" rx="12" fill="#fff" stroke="#c7d2ce" stroke-width="2"/><rect x="88" y="522" width="44" height="66" rx="4" fill="#b56439" stroke="#b56439" stroke-width="2"/><text x="164" y="566" font-size="31" fill="#b56439" font-weight="700">SERVICES</text><text x="570" y="566" font-size="29" fill="#203b42" font-weight="400">Reserve routes and inspection access</text><rect x="64" y="630" width="1472" height="110" rx="12" fill="#fff" stroke="#c7d2ce" stroke-width="2"/><rect x="88" y="652" width="44" height="66" rx="4" fill="#796a91" stroke="#796a91" stroke-width="2"/><text x="164" y="696" font-size="31" fill="#796a91" font-weight="700">FIT-OUT</text><text x="570" y="696" font-size="29" fill="#203b42" font-weight="400">Support change within agreed constraints</text><path d="M64 816 L1536 816" fill="none" stroke="#becbc5" stroke-width="2"/><text x="64" y="855" font-size="22" fill="#53696d" font-weight="400">Conceptual layers, not an installation sequence. All interfaces still require coordination.</text></g></svg>