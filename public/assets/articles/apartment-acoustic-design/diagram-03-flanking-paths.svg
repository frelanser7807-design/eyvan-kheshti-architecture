<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">Apartment acoustic flanking paths</title><desc id="d">Sound bypasses a separating wall through façade, slab, ceiling, riser and services.</desc><rect width="1600" height="900" fill="#111616"/><text x="80" y="90" fill="#d8aa68" font-family="Arial" font-size="20" letter-spacing="6">FLANKING REVIEW · 08–09</text><text x="80" y="160" fill="#fff" font-family="Georgia" font-size="60">The wall is only one path</text><g transform="translate(270 250)"><rect width="900" height="420" fill="#202727" stroke="#e0b271" stroke-width="4"/><path d="M450 0v420" stroke="#f4ead8" stroke-width="34"/><path d="M0 80h900M0 340h900" stroke="#596361" stroke-width="18"/><path d="M0 210h900" stroke="#727e7b" stroke-width="4" stroke-dasharray="14 10"/><g fill="none" stroke="#e0a458" stroke-width="9"><path d="M260 180C440 40 520 40 700 180"/><path d="M260 240C440 380 520 380 700 240"/><path d="M300 140C400 200 560 200 660 140"/></g></g><g fill="#f0c889" font-family="Arial" font-size="20"><text x="1200" y="310">01 · FAÇADE</text><text x="1200" y="370">02 · SLAB</text><text x="1200" y="430">03 · CEILING</text><text x="1200" y="490">04 · RISER</text><text x="1200" y="550">05 · SERVICES</text></g><text x="80" y="825" fill="#818a87" font-family="Arial" font-size="18">TRACE ONE CONTINUOUS ACOUSTIC BOUNDARY AROUND EVERY DWELLING IN PLAN AND SECTION.</text></svg>
