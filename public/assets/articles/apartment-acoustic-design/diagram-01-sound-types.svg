<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">Four sound problems in apartments</title><desc id="d">Airborne, impact, structure-borne and reverberant sound require different responses.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111516"/><stop offset="1" stop-color="#202629"/></linearGradient></defs><rect width="1600" height="900" fill="url(#bg)"/><text x="80" y="90" fill="#d9ad6c" font-family="Arial" font-size="20" letter-spacing="6">APARTMENT ACOUSTICS · DIAGNOSTIC MAP</text><text x="80" y="160" fill="#fff" font-family="Georgia" font-size="60">Name the sound before choosing the detail</text><g font-family="Arial"><g fill="#1d2425" stroke="#c99758" stroke-width="2"><rect x="80" y="280" width="330" height="360"/><rect x="450" y="280" width="330" height="360"/><rect x="820" y="280" width="330" height="360"/><rect x="1190" y="280" width="330" height="360"/></g><g fill="#dcb06f" font-size="54"><text x="120" y="360">01</text><text x="490" y="360">02</text><text x="860" y="360">03</text><text x="1230" y="360">04</text></g><g fill="#fff" font-size="24"><text x="120" y="430">AIRBORNE</text><text x="490" y="430">IMPACT</text><text x="860" y="430">STRUCTURE-BORNE</text><text x="1230" y="430">REVERBERATION</text></g><g fill="#aeb8b6" font-size="19"><text x="120" y="485">Speech · TV · Traffic</text><text x="490" y="485">Footsteps · Furniture</text><text x="860" y="485">Plant · Lifts · Pipes</text><text x="1230" y="485">Hard rooms · Corridors</text><text x="120" y="565">Mass + seal</text><text x="490" y="565">Resilient isolation</text><text x="860" y="565">Mount + disconnect</text><text x="1230" y="565">Absorb + shape</text></g></g><text x="80" y="815" fill="#7f8987" font-family="Arial" font-size="18">ONE PRODUCT CANNOT SOLVE FOUR DIFFERENT TRANSMISSION MECHANISMS.</text></svg>
