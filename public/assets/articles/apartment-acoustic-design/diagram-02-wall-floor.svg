<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">Acoustic wall and floor assembly</title><desc id="d">Simplified section illustrates mass, decoupling, absorption and sealed edges.</desc><rect width="1600" height="900" fill="#ebe5db"/><text x="80" y="90" fill="#89602f" font-family="Arial" font-size="20" letter-spacing="6">ASSEMBLY LOGIC · 03–05</text><text x="80" y="160" fill="#1c2221" font-family="Georgia" font-size="60">Performance lives in the junction</text><g transform="translate(370 255)"><rect width="120" height="430" fill="#303737"/><rect x="140" width="36" height="430" fill="#b98b52"/><rect x="190" width="130" height="430" fill="#8f9e9c"/><rect x="334" width="36" height="430" fill="#b98b52"/><rect x="390" width="120" height="430" fill="#303737"/><rect x="-110" y="430" width="730" height="90" fill="#454d4c"/><rect x="-110" y="405" width="730" height="20" fill="#d6a45f"/><path d="M-110 400H620" stroke="#fff" stroke-width="6" stroke-dasharray="16 10"/></g><g font-family="Arial" font-size="21" fill="#5d4932"><text x="80" y="310">MASS</text><text x="80" y="370">DECOUPLE</text><text x="80" y="430">ABSORB</text><text x="80" y="490">SEAL</text></g><g stroke="#9d713b" stroke-width="3"><path d="M170 303h190"/><path d="M190 363h330"/><path d="M180 423h380"/><path d="M150 483h220"/></g><text x="1030" y="335" fill="#1f2524" font-family="Georgia" font-size="36">Check every bridge</text><text x="1030" y="390" fill="#5c6663" font-family="Arial" font-size="20">• slab edge</text><text x="1030" y="430" fill="#5c6663" font-family="Arial" font-size="20">• façade mullion</text><text x="1030" y="470" fill="#5c6663" font-family="Arial" font-size="20">• sockets + pipes</text><text x="1030" y="510" fill="#5c6663" font-family="Arial" font-size="20">• ceiling void</text><text x="1030" y="550" fill="#5c6663" font-family="Arial" font-size="20">• skirting + threshold</text><text x="80" y="825" fill="#726c63" font-family="Arial" font-size="18">SIMPLIFIED EXPLANATORY SECTION · USE TESTED ASSEMBLIES AND PROJECT-SPECIFIC ACOUSTIC ADVICE.</text></svg>
