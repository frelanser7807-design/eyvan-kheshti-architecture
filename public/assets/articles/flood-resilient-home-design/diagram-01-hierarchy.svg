<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">Flood resilient design hierarchy</title><desc id="d">Four-stage hierarchy from avoiding risk to designing for recovery.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0d171a"/><stop offset="1" stop-color="#18313a"/></linearGradient></defs><rect width="1600" height="900" fill="url(#bg)"/><text x="80" y="90" fill="#d9ad6c" font-family="Arial" font-size="20" letter-spacing="6">FLOOD DESIGN · DECISION HIERARCHY</text><text x="80" y="160" fill="#fff" font-family="Georgia" font-size="60">Start before the water reaches the wall</text><g transform="translate(130 300)" font-family="Arial"><g><path d="M0 0h280l70 115-70 115H0l70-115z" fill="#e5c18a"/><path d="M300 0h280l70 115-70 115H300l70-115z" fill="#9db8bd"/><path d="M600 0h280l70 115-70 115H600l70-115z" fill="#668d98"/><path d="M900 0h280l70 115-70 115H900l70-115z" fill="#365d69"/></g><g text-anchor="middle" font-size="26"><text x="175" y="105" fill="#1d2525">01 · AVOID</text><text x="475" y="105" fill="#172123">02 · ELEVATE</text><text x="775" y="105" fill="#fff">03 · RESIST</text><text x="1075" y="105" fill="#fff">04 · RECOVER</text></g><g text-anchor="middle" font-size="18"><text x="175" y="145">safer location</text><text x="475" y="145">people + systems</text><text x="775" y="145" fill="#e9f0f1">within safe limits</text><text x="1075" y="145" fill="#e9f0f1">clean · dry · return</text></g></g><text x="130" y="650" fill="#d4dde0" font-family="Georgia" font-size="34">Resistance is one layer—not permission to ignore site risk.</text><text x="80" y="825" fill="#839398" font-family="Arial" font-size="18">THE CORRECT STRATEGY DEPENDS ON FLOOD TYPE, DEPTH, VELOCITY, DURATION, STRUCTURE AND LOCAL POLICY.</text></svg>
