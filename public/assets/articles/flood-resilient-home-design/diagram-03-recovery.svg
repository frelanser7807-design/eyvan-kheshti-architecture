<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">Flood recovery sequence</title><desc id="d">Six stages from life safety and inspection to reoccupation.</desc><rect width="1600" height="900" fill="#11191b"/><text x="80" y="90" fill="#d8ad70" font-family="Arial" font-size="20" letter-spacing="6">RECOVERY-DAY PLAN</text><text x="80" y="160" fill="#fff" font-family="Georgia" font-size="60">Design the return home</text><path d="M140 460H1460" stroke="#527784" stroke-width="8"/><g font-family="Arial" text-anchor="middle"><g fill="#d9ad6c" stroke="#f4dec0" stroke-width="4"><circle cx="180" cy="460" r="64"/><circle cx="430" cy="460" r="64"/><circle cx="680" cy="460" r="64"/><circle cx="930" cy="460" r="64"/><circle cx="1180" cy="460" r="64"/><circle cx="1420" cy="460" r="64"/></g><g fill="#1e292b" font-size="26"><text x="180" y="470">01</text><text x="430" y="470">02</text><text x="680" y="470">03</text><text x="930" y="470">04</text><text x="1180" y="470">05</text><text x="1420" y="470">06</text></g><g fill="#fff" font-size="20"><text x="180" y="580">SAFETY</text><text x="430" y="580">INSPECT</text><text x="680" y="580">CLEAN</text><text x="930" y="580">DRY</text><text x="1180" y="580">REPAIR</text><text x="1420" y="580">REOCCUPY</text></g></g><text x="80" y="730" fill="#bbc8cb" font-family="Georgia" font-size="32">Every concealed cavity and service should support this sequence.</text><text x="80" y="825" fill="#809094" font-family="Arial" font-size="18">REOCCUPATION REQUIRES QUALIFIED ASSESSMENT OF STRUCTURE, CONTAMINATION, ELECTRICS AND MOISTURE.</text></svg>
