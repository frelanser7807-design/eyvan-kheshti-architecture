<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#ece6da"/><text x="80" y="90" font-family="Arial" font-size="25" letter-spacing="4" fill="#80643b">FIG. 04 · VERIFICATION LADDER</text><text x="80" y="165" font-family="Georgia" font-size="58" fill="#20221f">Increase precision as the design develops</text><g font-family="Arial" fill="#20221f"><g transform="translate(90 580)"><rect width="300" height="120" fill="#d7c29c"/><text x="25" y="52" font-size="24">01 · MASSING</text><text x="25" y="88" font-size="20">Horizon + orientation</text></g><g transform="translate(450 470)"><rect width="300" height="230" fill="#c9b17f"/><text x="25" y="52" font-size="24">02 · CONCEPT</text><text x="25" y="88" font-size="20">Depth + balcony</text></g><g transform="translate(810 340)"><rect width="300" height="360" fill="#b99a5d"/><text x="25" y="52" font-size="24">03 · DETAILED MODEL</text><text x="25" y="88" font-size="20">Frames + glazing + control</text></g><g transform="translate(1170 230)"><rect width="300" height="470" fill="#9f7d41"/><text x="25" y="52" font-size="24">04 · OCCUPANCY</text><text x="25" y="88" font-size="20">Observe + measure + learn</text></g></g><text x="90" y="805" font-family="Arial" font-size="23" fill="#725d40">Always name the metric, climate file, threshold and modelling assumptions.</text></svg>
