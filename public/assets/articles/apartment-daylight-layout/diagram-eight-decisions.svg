<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#151817"/><text x="80" y="90" font-family="Arial" font-size="25" letter-spacing="4" fill="#c5a15b">FIG. 03 · EIGHT LAYOUT DECISIONS</text><text x="80" y="160" font-family="Georgia" font-size="57" fill="#f4efe4">Before increasing the glass</text><g font-family="Arial" font-size="23" fill="#f4efe4"><g transform="translate(80 240)"><rect width="700" height="120" fill="#273432"/><text x="28" y="48">01 · GIVE THE BEST EDGE TO DAILY LIFE</text><text x="28" y="90">02 · CONTROL ROOM DEPTH</text></g><g transform="translate(820 240)"><rect width="700" height="120" fill="#403527"/><text x="28" y="48">03 · DRAW BALCONIES IN SECTION</text><text x="28" y="90">04 · MOVE TALL STORAGE INBOARD</text></g><g transform="translate(80 410)"><rect width="700" height="120" fill="#3a3932"/><text x="28" y="48">05 · BORROW LIGHT HONESTLY</text><text x="28" y="90">06 · CONTROL GLARE IN LAYERS</text></g><g transform="translate(820 410)"><rect width="700" height="120" fill="#293a40"/><text x="28" y="48">07 · COORDINATE PRIVACY + VIEW</text><text x="28" y="90">08 · SIMPLIFY DEEP CIRCULATION</text></g></g><path d="M90 670h1420" stroke="#c5a15b" stroke-width="8"/><text x="80" y="760" font-family="Arial" font-size="24" fill="#f4efe4">LAYOUT → SECTION → CONTROL → VERIFICATION</text></svg>
