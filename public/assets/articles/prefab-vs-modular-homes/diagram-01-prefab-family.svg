<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Prefab housing family diagram</title>
  <desc id="desc">A comparison of kit-of-parts, panelised, volumetric modular and manufactured homes.</desc>
  <rect width="1600" height="980" fill="#0d1110"/>
  <text x="100" y="100" fill="#d7b77b" font-family="Arial, sans-serif" font-size="24" letter-spacing="6">WORLD ARCH JOURNAL / SYSTEM MAP</text>
  <text x="100" y="175" fill="#f4efe5" font-family="Georgia, serif" font-size="62">Prefab is the family, not one product</text>
  <text x="100" y="225" fill="#aeb7b2" font-family="Arial, sans-serif" font-size="24">The defining question is how much of the building is completed away from its final site.</text>
  <g transform="translate(100 310)" font-family="Arial, sans-serif">
    <g>
      <rect width="320" height="470" rx="24" fill="#171d1b" stroke="#45504b"/>
      <text x="28" y="58" fill="#d7b77b" font-size="19" letter-spacing="3">01 / 1D</text>
      <text x="28" y="105" fill="#f4efe5" font-size="34">Kit of parts</text>
      <path d="M48 250h224M80 210v90M140 190v110M200 205v95M260 185v115" stroke="#d7b77b" stroke-width="8" stroke-linecap="round"/>
      <text x="28" y="372" fill="#c8cfcb" font-size="22">Pre-cut components</text>
      <text x="28" y="410" fill="#89938e" font-size="19">Most assembly happens</text>
      <text x="28" y="438" fill="#89938e" font-size="19">on the building site.</text>
    </g>
    <g transform="translate(350)">
      <rect width="320" height="470" rx="24" fill="#171d1b" stroke="#45504b"/>
      <text x="28" y="58" fill="#d7b77b" font-size="19" letter-spacing="3">02 / 2D</text>
      <text x="28" y="105" fill="#f4efe5" font-size="34">Panelised</text>
      <rect x="55" y="175" width="210" height="140" fill="none" stroke="#d7b77b" stroke-width="8"/>
      <path d="M160 175v140M55 245h210" stroke="#d7b77b" stroke-width="5"/>
      <text x="28" y="372" fill="#c8cfcb" font-size="22">Walls, floors, roofs</text>
      <text x="28" y="410" fill="#89938e" font-size="19">Flat elements arrive for</text>
      <text x="28" y="438" fill="#89938e" font-size="19">rapid site assembly.</text>
    </g>
    <g transform="translate(700)">
      <rect width="320" height="470" rx="24" fill="#171d1b" stroke="#d7b77b" stroke-width="2"/>
      <text x="28" y="58" fill="#d7b77b" font-size="19" letter-spacing="3">03 / 3D</text>
      <text x="28" y="105" fill="#f4efe5" font-size="34">Modular</text>
      <path d="M65 210l95-50 95 50v105l-95 50-95-50zM65 210l95 50 95-50M160 260v105" fill="none" stroke="#d7b77b" stroke-width="8"/>
      <text x="28" y="372" fill="#c8cfcb" font-size="22">Volumetric rooms</text>
      <text x="28" y="410" fill="#89938e" font-size="19">Enclosed sections are</text>
      <text x="28" y="438" fill="#89938e" font-size="19">transported and joined.</text>
    </g>
    <g transform="translate(1050)">
      <rect width="320" height="470" rx="24" fill="#171d1b" stroke="#45504b"/>
      <text x="28" y="58" fill="#d7b77b" font-size="19" letter-spacing="3">04 / LEGAL CLASS</text>
      <text x="28" y="105" fill="#f4efe5" font-size="34">Manufactured</text>
      <path d="M45 270h230l-32-92H82zM82 270v56h161v-56M112 326v30M215 326v30" fill="none" stroke="#d7b77b" stroke-width="8" stroke-linejoin="round"/>
      <text x="28" y="372" fill="#c8cfcb" font-size="22">Jurisdiction-specific</text>
      <text x="28" y="410" fill="#89938e" font-size="19">In the US, a federal HUD</text>
      <text x="28" y="438" fill="#89938e" font-size="19">Code category—not modular.</text>
    </g>
  </g>
  <text x="100" y="875" fill="#f4efe5" font-family="Arial, sans-serif" font-size="25">Design consequence</text>
  <text x="335" y="875" fill="#aeb7b2" font-family="Arial, sans-serif" font-size="25">More factory completion usually means earlier design freeze, tighter transport limits and more critical interfaces.</text>
  <text x="100" y="930" fill="#6f7b75" font-family="Arial, sans-serif" font-size="18">Original editorial diagram · Terminology varies by jurisdiction and procurement system.</text>
</svg>
