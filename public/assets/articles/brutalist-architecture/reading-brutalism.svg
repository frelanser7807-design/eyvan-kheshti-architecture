<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Four questions for reading Brutalist architecture</title>
  <desc id="desc">Original World Arch Journal diagram about material, structure, circulation and public life.</desc>
  <rect width="1600" height="1000" fill="#e9e4da"/>
  <text x="110" y="135" fill="#151817" font-family="Georgia,serif" font-size="72">Brutalism is not a concrete filter</text>
  <text x="112" y="200" fill="#665f55" font-family="Arial,sans-serif" font-size="25" letter-spacing="4">READ THE BUILDING THROUGH FOUR QUESTIONS</text>
  <g font-family="Arial,sans-serif">
    <g transform="translate(110,300)"><rect width="640" height="230" fill="#1b2528"/><text x="45" y="75" fill="#d7ad72" font-size="28">01 · MATERIAL</text><text x="45" y="130" fill="#fffaf0" font-size="34" font-weight="700">What is allowed to remain visible?</text><text x="45" y="180" fill="#c7c4bd" font-size="23">Formwork, joints, repair, weathering and labour.</text></g>
    <g transform="translate(850,300)"><rect width="640" height="230" fill="#394246"/><text x="45" y="75" fill="#d7ad72" font-size="28">02 · STRUCTURE</text><text x="45" y="130" fill="#fffaf0" font-size="34" font-weight="700">How does force become form?</text><text x="45" y="180" fill="#d9d6cf" font-size="23">Frames, spans, cores, cantilevers and modules.</text></g>
    <g transform="translate(110,610)"><rect width="640" height="230" fill="#695f52"/><text x="45" y="75" fill="#fff1d8" font-size="28">03 · CIRCULATION</text><text x="45" y="130" fill="#fffaf0" font-size="34" font-weight="700">Can movement explain the building?</text><text x="45" y="180" fill="#eee8df" font-size="23">Terraces, streets, bridges, stairs and thresholds.</text></g>
    <g transform="translate(850,610)"><rect width="640" height="230" fill="#9a764b"/><text x="45" y="75" fill="#0c202d" font-size="28">04 · PUBLIC LIFE</text><text x="45" y="130" fill="#101615" font-size="34" font-weight="700">Who is the monument for?</text><text x="45" y="180" fill="#272826" font-size="23">Use, access, care, memory and civic meaning.</text></g>
  </g>
  <text x="110" y="940" fill="#665f55" font-family="Arial,sans-serif" font-size="24">Original World Arch Journal diagram · Use these questions before deciding whether a building is “beautiful” or “ugly”.</text>
</svg>
