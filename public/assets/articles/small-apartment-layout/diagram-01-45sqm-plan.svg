<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Concept plan for a 45 square metre apartment</title>
  <desc id="desc">Editorial plan diagram showing a service spine, daylight zone, flexible room and privacy threshold.</desc>
  <rect width="1600" height="900" fill="#f3efe7"/>
  <text x="90" y="100" fill="#101820" font-family="Georgia,serif" font-size="58">A 45 m² apartment as three bands</text>
  <text x="90" y="150" fill="#a56f2d" font-family="Arial,sans-serif" font-size="22" letter-spacing="4">ORIGINAL EDITORIAL PROTOTYPE · NOT FOR CONSTRUCTION</text>
  <g transform="translate(150 235)">
    <rect x="0" y="0" width="1300" height="500" fill="#fff" stroke="#101820" stroke-width="8"/>
    <rect x="0" y="0" width="300" height="500" fill="#28343d"/>
    <rect x="300" y="0" width="420" height="500" fill="#d9c7a9"/>
    <rect x="720" y="0" width="580" height="500" fill="#f4e9d6"/>
    <rect x="15" y="20" width="270" height="160" rx="10" fill="#17242d" stroke="#c89550" stroke-width="3"/>
    <rect x="15" y="200" width="270" height="285" rx="10" fill="#17242d" stroke="#c89550" stroke-width="3"/>
    <path d="M300 330H720" stroke="#101820" stroke-width="5" stroke-dasharray="14 12"/>
    <path d="M720 0V500" stroke="#101820" stroke-width="5" stroke-dasharray="14 12"/>
    <path d="M1300 45H1300M1300 0V500" stroke="#6f9f92" stroke-width="18"/>
    <g font-family="Arial,sans-serif" text-anchor="middle">
      <text x="150" y="110" fill="#fff" font-size="28" font-weight="700">ENTRY + BATH</text>
      <text x="150" y="345" fill="#fff" font-size="28" font-weight="700">KITCHEN + STORAGE</text>
      <text x="510" y="175" fill="#101820" font-size="30" font-weight="700">FLEX ROOM</text>
      <text x="510" y="215" fill="#4d5961" font-size="21">work · sleep · guest</text>
      <text x="1010" y="240" fill="#101820" font-size="31" font-weight="700">DAYLIGHT ROOM</text>
      <text x="1010" y="282" fill="#4d5961" font-size="21">living · dining · view</text>
      <text x="1270" y="455" fill="#416e65" font-size="20" transform="rotate(-90 1270 455)">PRIMARY WINDOW</text>
    </g>
    <path d="M335 330C460 380 585 380 690 330" fill="none" stroke="#a56f2d" stroke-width="6"/>
    <text x="510" y="420" text-anchor="middle" fill="#a56f2d" font-family="Arial,sans-serif" font-size="20">SLIDING PRIVACY LAYER</text>
  </g>
  <text x="800" y="820" text-anchor="middle" fill="#101820" font-family="Arial,sans-serif" font-size="25">Keep fixed services compact; give the best daylight to the room that changes most through the day.</text>
</svg>
