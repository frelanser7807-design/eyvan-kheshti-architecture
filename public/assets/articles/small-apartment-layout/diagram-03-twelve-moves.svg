<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Twelve small apartment layout moves</title>
  <desc id="desc">A matrix summarising twelve layout moves across daylight, storage, privacy and adaptability.</desc>
  <rect width="1600" height="900" fill="#f3efe7"/>
  <text x="90" y="100" fill="#101820" font-family="Georgia,serif" font-size="58">Twelve moves, four design jobs</text>
  <text x="90" y="150" fill="#a56f2d" font-family="Arial,sans-serif" font-size="22" letter-spacing="4">A SMALL HOME NEEDS PRIORITIES, NOT GIMMICKS</text>
  <g font-family="Arial,sans-serif">
    <g transform="translate(90 220)"><rect width="330" height="560" rx="26" fill="#101820"/><text x="35" y="65" fill="#c89550" font-size="27" font-weight="700">DAYLIGHT</text><text x="35" y="125" fill="#fff" font-size="23">01 · Clear window zone</text><text x="35" y="180" fill="#fff" font-size="23">02 · Low furniture edge</text><text x="35" y="235" fill="#fff" font-size="23">03 · Filter, don’t block</text><path d="M35 300H295" stroke="#c89550"/><text x="35" y="355" fill="#bfb3a3" font-size="19">Put the most-used room</text><text x="35" y="387" fill="#bfb3a3" font-size="19">where daylight is strongest.</text></g>
    <g transform="translate(455 220)"><rect width="330" height="560" rx="26" fill="#28343d"/><text x="35" y="65" fill="#c89550" font-size="27" font-weight="700">STORAGE</text><text x="35" y="125" fill="#fff" font-size="23">04 · One deep spine</text><text x="35" y="180" fill="#fff" font-size="23">05 · Use full height</text><text x="35" y="235" fill="#fff" font-size="23">06 · Store by frequency</text><path d="M35 300H295" stroke="#c89550"/><text x="35" y="355" fill="#d7d0c7" font-size="19">Concentrate storage so</text><text x="35" y="387" fill="#d7d0c7" font-size="19">the rest can stay calm.</text></g>
    <g transform="translate(820 220)"><rect width="330" height="560" rx="26" fill="#d9c7a9"/><text x="35" y="65" fill="#70491f" font-size="27" font-weight="700">PRIVACY</text><text x="35" y="125" fill="#101820" font-size="23">07 · Offset the entry view</text><text x="35" y="180" fill="#101820" font-size="23">08 · Build thresholds</text><text x="35" y="235" fill="#101820" font-size="23">09 · Seal sound paths</text><path d="M35 300H295" stroke="#70491f"/><text x="35" y="355" fill="#3d454a" font-size="19">A screen can create choice</text><text x="35" y="387" fill="#3d454a" font-size="19">without stealing daylight.</text></g>
    <g transform="translate(1185 220)"><rect width="330" height="560" rx="26" fill="#c89550"/><text x="35" y="65" fill="#101820" font-size="27" font-weight="700">ADAPTABILITY</text><text x="35" y="125" fill="#101820" font-size="23">10 · Size real clearances</text><text x="35" y="180" fill="#101820" font-size="23">11 · Double-duty edges</text><text x="35" y="235" fill="#101820" font-size="23">12 · Keep one loose zone</text><path d="M35 300H295" stroke="#101820"/><text x="35" y="355" fill="#27343d" font-size="19">Let the plan absorb work,</text><text x="35" y="387" fill="#27343d" font-size="19">guests and future change.</text></g>
  </g>
</svg>
