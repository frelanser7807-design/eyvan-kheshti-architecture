<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">Layered wildfire site strategy</title><desc id="d">Concentric zones connect the home to an immediate low fuel zone and wider managed landscape.</desc><rect width="1600" height="900" fill="#101413"/><text x="80" y="90" fill="#e0ad68" font-family="Arial" font-size="20" letter-spacing="6">SITE STRATEGY · 10–12</text><text x="80" y="160" fill="#fff7e9" font-family="Georgia" font-size="60">Resilience expands beyond the wall</text><g transform="translate(800 500)" fill="none"><circle r="300" stroke="#526159" stroke-width="90"/><circle r="205" stroke="#8d754e" stroke-width="85"/><circle r="115" stroke="#e2b16c" stroke-width="70"/><rect x="-70" y="-58" width="140" height="116" fill="#f3eadb" stroke="#1b201e" stroke-width="5"/></g><g font-family="Arial" font-size="20"><text x="736" y="507" fill="#1c211f">HOME</text><text x="1030" y="500" fill="#f9e7c7">LOW-FUEL IMMEDIATE ZONE</text><text x="1040" y="640" fill="#f0d6ad">MANAGED PLANTING + ATTACHMENTS</text><text x="1030" y="765" fill="#c7d1cb">WIDER SITE, ACCESS + NEIGHBOURS</text></g><g stroke="#e0ad68" stroke-width="3"><path d="M920 495h95"/><path d="M960 625h65"/><path d="M950 750h65"/></g><text x="80" y="835" fill="#818984" font-family="Arial" font-size="18">DISTANCES AND VEGETATION REQUIREMENTS MUST FOLLOW THE SPECIFIC SITE, RISK ASSESSMENT AND LOCAL AUTHORITY.</text></svg>
