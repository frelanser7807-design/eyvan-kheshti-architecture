<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">Wildfire resilient envelope details</title><desc id="d">A house section annotated with six envelope priorities.</desc><defs><linearGradient id="bg" x2="1"><stop stop-color="#f0eadf"/><stop offset="1" stop-color="#d8cbb8"/></linearGradient></defs><rect width="1600" height="900" fill="url(#bg)"/><text x="80" y="85" fill="#8c5d27" font-family="Arial" font-size="20" letter-spacing="6">ENVELOPE REVIEW · 01–06</text><text x="80" y="150" fill="#202321" font-family="Georgia" font-size="58">Six details, one continuous defence</text><path d="M360 620V350L680 180l330 170v270H360z" fill="#303735" stroke="#9a692d" stroke-width="8"/><path d="M315 375L680 175l375 200" fill="none" stroke="#171b1a" stroke-width="38"/><rect x="575" y="420" width="210" height="200" fill="#91a4aa" stroke="#f0cc91" stroke-width="8"/><rect x="835" y="430" width="95" height="190" fill="#1b201e" stroke="#e5c082" stroke-width="5"/><g fill="#6b441d" font-family="Arial" font-size="20"><text x="80" y="300">01 · TESTED ROOF ASSEMBLY</text><text x="80" y="355">02 · CLOSED EDGES + RIDGES</text><text x="80" y="410">03 · CLEANABLE GUTTERS</text><text x="1090" y="300">04 · EMBER-RESISTANT VENTS</text><text x="1090" y="355">05 · ENCLOSED EAVES</text><text x="1090" y="410">06 · PROTECTED WINDOWS</text></g><g stroke="#a56f31" stroke-width="3"><path d="M290 292H510"/><path d="M290 347H420"/><path d="M290 402H350"/><path d="M1010 292h60"/><path d="M995 347h75"/><path d="M785 402h285"/></g><text x="80" y="815" fill="#716b61" font-family="Arial" font-size="18">DETAIL PERFORMANCE DEPENDS ON TESTED PRODUCTS, INSTALLATION, LOCAL CODE AND SITE EXPOSURE.</text></svg>
