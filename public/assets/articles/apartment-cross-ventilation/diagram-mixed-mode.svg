<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f2eee6"/><text x="80" y="90" font-family="Arial" font-size="25" letter-spacing="4" fill="#7e6238">FIG. 05 · MIXED-MODE SEQUENCE</text><text x="80" y="165" font-family="Georgia" font-size="58" fill="#20221f">Four conditions, four clear responses</text><g font-family="Arial" font-size="24" fill="#20221f"><g transform="translate(80 260)"><rect width="330" height="360" fill="#d8e9e8"/><text x="28" y="60">01 · MILD WEATHER</text><text x="28" y="120">Opposite openings</text><text x="28" y="160">Shading adjusted</text></g><g transform="translate(450 260)"><rect width="330" height="360" fill="#cbdce8"/><text x="28" y="60">02 · COOL NIGHT</text><text x="28" y="120">Secure purge vents</text><text x="28" y="160">Stored heat released</text></g><g transform="translate(820 260)"><rect width="330" height="360" fill="#e6d5c1"/><text x="28" y="60">03 · POLLUTED / NOISY</text><text x="28" y="120">Windows closed</text><text x="28" y="160">Filtered ventilation</text></g><g transform="translate(1190 260)"><rect width="330" height="360" fill="#d9c3bd"/><text x="28" y="60">04 · EXTREME HEAT</text><text x="28" y="120">Solar control</text><text x="28" y="160">Mechanical cooling</text></g></g><text x="80" y="760" font-family="Arial" font-size="24" fill="#725d3f">The exact sequence must be designed and commissioned for the project.</text></svg>
