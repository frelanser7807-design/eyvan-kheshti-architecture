<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 980"><defs><style>.b{fill:#101615}.x{fill:#1c2825;stroke:#5e7169;stroke-width:2}.t{font:700 30px Arial;fill:#f3eee5}.h{font:700 22px Arial;fill:#f3eee5}.s{font:400 18px Arial;fill:#bdb7ac}.n{font:700 17px Arial;fill:#d7b777}</style></defs><rect width="1600" height="980" class="b"/><text x="90" y="85" class="n">COMPACT COURTYARD MATRIX</text><text x="90" y="135" class="t">NINE MOVES · ONE COORDINATED ROOM</text><g transform="translate(90 205)"><g><rect width="440" height="190" rx="8" class="x"/><text x="30" y="45" class="n">01</text><text x="30" y="88" class="h">PURPOSE</text><text x="30" y="130" class="s">name the court’s primary job</text></g><g transform="translate(490)"><rect width="440" height="190" rx="8" class="x"/><text x="30" y="45" class="n">02</text><text x="30" y="88" class="h">SECTION</text><text x="30" y="130" class="s">test sky, sun and overlooking</text></g><g transform="translate(980)"><rect width="440" height="190" rx="8" class="x"/><text x="30" y="45" class="n">03</text><text x="30" y="88" class="h">LIGHT</text><text x="30" y="130" class="s">borrow brightness, control glare</text></g><g transform="translate(0 235)"><rect width="440" height="190" rx="8" class="x"/><text x="30" y="45" class="n">04</text><text x="30" y="88" class="h">AIR</text><text x="30" y="130" class="s">draw a complete ventilation path</text></g><g transform="translate(490 235)"><rect width="440" height="190" rx="8" class="x"/><text x="30" y="45" class="n">05</text><text x="30" y="88" class="h">THRESHOLD</text><text x="30" y="130" class="s">make shade and inhabitable edges</text></g><g transform="translate(980 235)"><rect width="440" height="190" rx="8" class="x"/><text x="30" y="45" class="n">06</text><text x="30" y="88" class="h">PLANTING</text><text x="30" y="130" class="s">design the mature canopy</text></g><g transform="translate(0 470)"><rect width="440" height="190" rx="8" class="x"/><text x="30" y="45" class="n">07</text><text x="30" y="88" class="h">WATER + SURFACE</text><text x="30" y="130" class="s">coordinate comfort and drainage</text></g><g transform="translate(490 470)"><rect width="440" height="190" rx="8" class="x"/><text x="30" y="45" class="n">08</text><text x="30" y="88" class="h">USEFUL EDGES</text><text x="30" y="130" class="s">seat, store, screen and maintain</text></g><g transform="translate(980 470)"><rect width="440" height="190" rx="8" class="x"/><text x="30" y="45" class="n">09</text><text x="30" y="88" class="h">SEASONS</text><text x="30" y="130" class="s">test the worst day, not one render</text></g></g><text x="90" y="925" class="s">PURPOSE → SECTION → LIGHT + AIR → INHABITED EDGES → LANDSCAPE + WATER → YEAR-ROUND EVIDENCE</text></svg>
