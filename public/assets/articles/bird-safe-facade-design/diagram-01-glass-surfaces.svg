<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
<title id="t">Pattern visibility at the exterior glass surface</title><desc id="d">Two facade sections compare an externally visible marker pattern with a pattern hidden behind reflective glazing.</desc>
<rect width="1600" height="900" fill="#f4f0e8"/><text x="95" y="90" font-family="Arial,sans-serif" font-size="25" letter-spacing="5" fill="#897448">FACADE DETAIL / 01</text><text x="95" y="150" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#20241f">VISIBILITY STARTS AT THE OUTER FACE</text>
<g transform="translate(90 220)"><rect width="680" height="555" rx="14" fill="#fff"/><text x="40" y="62" font-family="Arial" font-size="27" font-weight="700" fill="#23352e">EXTERIOR-MARKED ASSEMBLY</text><rect x="75" y="125" width="25" height="300" fill="#8b7153"/><rect x="145" y="125" width="20" height="300" fill="#72a9b0"/><rect x="205" y="125" width="15" height="300" fill="#d8e7e6"/><rect x="245" y="125" width="12" height="300" fill="#eef4f1"/><path d="M170 145h-37m37 55h-37m37 55h-37m37 55h-37m37 55h-37" stroke="#ba8638" stroke-width="9"/><path d="M290 280H190" stroke="#ba8638" stroke-width="5"/><path d="m190 280 18-12v24z" fill="#ba8638"/><text x="310" y="255" font-family="Arial" font-size="22" fill="#24352e">Bird-visible markers</text><text x="310" y="286" font-family="Arial" font-size="18" fill="#62716a">on the outer encounter surface</text><path d="M450 430V155" stroke="#5b806e" stroke-width="5" marker-end="url(#a)"/><text x="330" y="480" font-family="Arial" font-size="17" fill="#52645b">OUTDOOR VIEW → GLASS → INTERIOR</text></g>
<g transform="translate(830 220)"><rect width="680" height="555" rx="14" fill="#fff"/><text x="40" y="62" font-family="Arial" font-size="27" font-weight="700" fill="#6d4038">HIDDEN BEHIND REFLECTIVE GLASS</text><rect x="75" y="125" width="25" height="300" fill="#8b7153"/><rect x="145" y="125" width="17" height="300" fill="#72a9b0"/><rect x="195" y="125" width="17" height="300" fill="#d8e7e6"/><rect x="250" y="125" width="11" height="300" fill="#eef4f1"/><path d="M198 145h-36m36 55h-36m36 55h-36m36 55h-36m36 55h-36" stroke="#ba8638" stroke-width="9" opacity=".48"/><path d="M145 125l100 300M245 125 145 425" stroke="#758f98" stroke-width="5" opacity=".8"/><text x="290" y="230" font-family="Arial" font-size="22" fill="#6d4038">Reflections can</text><text x="290" y="260" font-family="Arial" font-size="22" fill="#6d4038">obscure interior markers</text><text x="70" y="480" font-family="Arial" font-size="17" fill="#52645b">SCHEMATIC ONLY · VERIFY THE TESTED GLASS BUILD-UP</text></g>
<text x="95" y="840" font-family="Arial" font-size="18" fill="#6d746c">Illustrative section · Not to scale · Pattern, surface and spacing depend on tested product evidence and local requirements.</text><defs><marker id="a" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#5b806e"/></marker></defs></svg>
