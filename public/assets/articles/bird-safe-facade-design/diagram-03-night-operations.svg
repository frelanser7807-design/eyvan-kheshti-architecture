<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">Nighttime bird-safe building operations</title><desc id="d">A building operating sequence combines shielded exterior fixtures, interior light control, seasonal schedules and facilities review.</desc>
<rect width="1600" height="900" fill="#17232c"/><text x="90" y="85" font-family="Arial" font-size="23" letter-spacing="5" fill="#d3bb83">LIGHTING STRATEGY / 03</text><text x="90" y="145" font-family="Arial" font-size="46" font-weight="700" fill="#f7f3e9">DESIGN THE NIGHT SHIFT, TOO</text>
<g transform="translate(110 220)"><rect x="0" y="105" width="740" height="390" fill="#273b42" stroke="#d8d6cb" stroke-width="6"/><rect x="65" y="175" width="160" height="280" fill="#96bac0"/><rect x="250" y="175" width="160" height="280" fill="#3c5358"/><rect x="435" y="175" width="160" height="280" fill="#96bac0"/><path d="M0 108h740" stroke="#d8d6cb" stroke-width="18"/><path d="M80 150v-55m0 0 36 22H62z" fill="#d8bd73"/><path d="M700 150v-55m0 0-36 22h74z" fill="#d8bd73"/><circle cx="115" cy="95" r="130" fill="#e9cd84" opacity=".09"/><circle cx="680" cy="95" r="130" fill="#e9cd84" opacity=".09"/><path d="M310 230h42m-42 38h42m-42 38h42m-42 38h42" stroke="#d5c27d" stroke-width="8"/><path d="M-10 565h770" stroke="#8eaa94" stroke-width="4"/><path d="M50 585q20-60 40 0m0 0q20-45 40 0m570 0q20-60 40 0" stroke="#8eaa94" stroke-width="8" fill="none"/></g>
<g font-family="Arial" fill="#f5f1e7"><text x="930" y="300" font-size="25" font-weight="700">01 · SHIELD EXTERIOR LIGHT</text><text x="930" y="337" font-size="19" fill="#bac6c0">Aim light down; avoid spill and glare.</text><text x="930" y="425" font-size="25" font-weight="700">02 · REDUCE INTERIOR GLOW</text><text x="930" y="462" font-size="19" fill="#bac6c0">Use occupancy controls and practical blinds.</text><text x="930" y="550" font-size="25" font-weight="700">03 · SET A SEASONAL SCHEDULE</text><text x="930" y="587" font-size="19" fill="#bac6c0">Dim or switch off nonessential zones at night.</text><text x="930" y="675" font-size="25" font-weight="700">04 · ASSIGN AN OPERATIONS OWNER</text><text x="930" y="712" font-size="19" fill="#bac6c0">Document controls, checks and post-occupancy review.</text><text x="90" y="820" font-size="18" fill="#bac6c0">Schematic guidance only · Coordinate with local migration-season guidance, security, occupancy and life-safety needs.</text></g></svg>
