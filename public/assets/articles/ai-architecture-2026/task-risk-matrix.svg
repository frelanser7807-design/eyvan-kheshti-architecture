<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc">
  <title id="title">AI task and risk matrix for architects</title>
  <desc id="desc">Original matrix showing that review intensity should rise with consequence and uncertainty.</desc>
  <rect width="1600" height="1050" fill="#071b2b"/>
  <text x="120" y="130" fill="#f7f2e8" font-family="Georgia,serif" font-size="70">Match review to consequence</text>
  <text x="122" y="190" fill="#c6b89f" font-family="Arial,sans-serif" font-size="24" letter-spacing="4">AI TASK / RISK MATRIX FOR ARCHITECTS</text>
  <g transform="translate(260,260)">
    <rect width="1100" height="610" fill="#102b3d" stroke="#8ea0a9" stroke-width="2"/>
    <rect x="550" width="550" height="305" fill="#8c6239" opacity=".9"/>
    <rect x="550" y="305" width="550" height="305" fill="#b98b50"/>
    <rect width="550" height="305" fill="#294f62"/>
    <rect y="305" width="550" height="305" fill="#1b3a4d"/>
    <line x1="550" y1="0" x2="550" y2="610" stroke="#f7f2e8" stroke-width="2"/>
    <line x1="0" y1="305" x2="1100" y2="305" stroke="#f7f2e8" stroke-width="2"/>
    <g fill="#f7f2e8" font-family="Arial,sans-serif"><text x="60" y="85" font-size="34" font-weight="700">EXPLORE</text><text x="60" y="135" font-size="24">mood boards · options · summaries</text><text x="610" y="85" font-size="34" font-weight="700">VERIFY</text><text x="610" y="135" font-size="24">code search · specifications · quantities</text><text x="60" y="390" font-size="34" font-weight="700">ASSIST</text><text x="60" y="440" font-size="24">meeting notes · admin · draft emails</text><text x="610" y="390" font-size="34" font-weight="700">CONTROL</text><text x="610" y="440" font-size="24">safety · contracts · client decisions · issue sets</text></g>
    <text x="550" y="690" text-anchor="middle" fill="#c6b89f" font-family="Arial,sans-serif" font-size="26">LOWER CONSEQUENCE  →  HIGHER CONSEQUENCE</text>
    <text transform="translate(-95,305) rotate(-90)" text-anchor="middle" fill="#c6b89f" font-family="Arial,sans-serif" font-size="26">LOWER UNCERTAINTY  →  HIGHER UNCERTAINTY</text>
  </g>
  <text x="120" y="980" fill="#c6b89f" font-family="Arial,sans-serif" font-size="24">Original World Arch Journal diagram · Human accountability remains with the practice.</text>
</svg>
