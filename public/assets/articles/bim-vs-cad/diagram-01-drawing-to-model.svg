<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">One BIM element, coordinated outputs</title>
  <desc id="desc">A wall element flows into a plan, section, schedule and quantity output.</desc>
  <rect width="1600" height="900" fill="#f2eee6"/>
  <text x="90" y="110" font-family="Arial,sans-serif" font-size="36" fill="#202321" letter-spacing="4">ONE ELEMENT / MANY OUTPUTS</text>
  <rect x="110" y="300" width="310" height="220" rx="24" fill="#202321"/>
  <text x="175" y="375" font-family="Arial,sans-serif" font-size="34" fill="#f2eee6">WALL TYPE</text>
  <text x="175" y="430" font-family="Arial,sans-serif" font-size="24" fill="#d9b26e">geometry + data</text>
  <g fill="#fffdf8" stroke="#202321" stroke-width="4">
    <rect x="710" y="180" width="340" height="150" rx="18"/><rect x="1160" y="180" width="340" height="150" rx="18"/>
    <rect x="710" y="470" width="340" height="150" rx="18"/><rect x="1160" y="470" width="340" height="150" rx="18"/>
  </g>
  <g font-family="Arial,sans-serif" font-size="28" fill="#202321">
    <text x="790" y="265">PLAN / VIEW</text><text x="1205" y="265">SECTION / VIEW</text>
    <text x="770" y="555">SCHEDULE / DATA</text><text x="1215" y="555">QUANTITY / CHECK</text>
  </g>
  <g fill="none" stroke="#c8784a" stroke-width="7">
    <path d="M420 410h240M620 380l55 30-55 30"/><path d="M675 410V255h35M675 410v135h35M675 410h480M1125 410V255h35M1125 410v135h35"/>
  </g>
  <text x="110" y="760" font-family="Arial,sans-serif" font-size="28" fill="#454b48">Coordination is useful only when the relationships are maintained and checked.</text>
</svg>
