<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Choosing a proportionate CAD or BIM workflow</title>
  <desc id="desc">A decision checklist based on outputs, coordination, information and handover.</desc>
  <rect width="1600" height="1000" fill="#f2eee6"/>
  <text x="100" y="115" font-family="Arial,sans-serif" font-size="36" fill="#202321" letter-spacing="4">CHOOSE THE LIGHTEST RELIABLE WORKFLOW</text>
  <g font-family="Arial,sans-serif" font-size="28" fill="#202321">
    <g><circle cx="150" cy="250" r="28" fill="#d9b26e"/><text x="215" y="260">Is the main deliverable a drawing?</text></g>
    <g><circle cx="150" cy="390" r="28" fill="#d9b26e"/><text x="215" y="400">Do several disciplines need coordination?</text></g>
    <g><circle cx="150" cy="530" r="28" fill="#d9b26e"/><text x="215" y="540">Will schedules, quantities or phases matter?</text></g>
    <g><circle cx="150" cy="670" r="28" fill="#d9b26e"/><text x="215" y="680">Is an information handover required?</text></g>
  </g>
  <g fill="#202321" font-family="Arial,sans-serif" font-size="31" text-anchor="middle"><rect x="1060" y="225" width="360" height="150" rx="22"/><text x="1240" y="315" fill="#f2eee6">CAD MAY BE ENOUGH</text><rect x="1060" y="525" width="360" height="150" rx="22"/><text x="1240" y="615" fill="#d9b26e">BIM IS WORTH TESTING</text></g>
  <g stroke="#c8784a" stroke-width="6" fill="none"><path d="M650 240h350M650 380h350M650 520h350M650 660h350"/><path d="M960 240v60M960 380v-60M960 520v80M960 660v-80"/></g>
  <text x="800" y="875" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" fill="#454b48">The best method matches information risk, not software fashion.</text>
</svg>
