<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
  <title id="t">Adaptive reuse as a core design problem</title><desc id="d">An existing structural frame receives a new programme through selective retention and reversible layers.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f0ebe2"/><stop offset="1" stop-color="#d8d0c1"/></linearGradient></defs><rect width="1600" height="900" fill="url(#bg)"/>
  <text x="90" y="95" fill="#263530" font-family="Arial,sans-serif" font-size="20" letter-spacing="7">03 / ADAPTIVE REUSE PEDAGOGY</text><text x="90" y="192" fill="#1b2926" font-family="Georgia,serif" font-size="72">Do not begin with a blank page.</text><text x="90" y="265" fill="#93683b" font-family="Georgia,serif" font-size="66">Begin with what is already there.</text>
  <g transform="translate(135 345)" fill="none"><path d="M0 430V0h770v430" stroke="#5e625b" stroke-width="15"/><path d="M0 140h770M0 282h770M160 0v430M350 0v430M555 0v430M770 0v430" stroke="#6f746d" stroke-width="8"/><path d="M26 420 220 250l165 62 205-166 150 65v209" fill="#c7985d" opacity=".55" stroke="#9d7140" stroke-width="5"/><path d="M27 419h713" stroke="#1f302c" stroke-width="7"/></g>
  <g transform="translate(1000 340)" font-family="Arial,sans-serif"><rect width="470" height="440" rx="16" fill="#21312e"/><text x="45" y="70" fill="#e5c995" font-size="18" letter-spacing="4">THE REUSE BRIEF</text><g fill="#f0e9dd" font-size="32"><text x="45" y="145">01  READ THE FABRIC</text><text x="45" y="220">02  STATE WHAT STAYS</text><text x="45" y="295">03  EXPLAIN REMOVAL</text><text x="45" y="370">04  DESIGN FOR CHANGE</text></g><path d="M45 400h380" stroke="#ac8550" stroke-width="3"/></g>
  <text x="90" y="844" fill="#53605b" font-family="Arial,sans-serif" font-size="20">The drawing becomes an argument about retention, carbon, use and future adaptability.</text>
