<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
  <title id="t">Circular workplace around a shared courtyard</title><desc id="d">A circular headquarters frames a planted social centre beneath an undulating roof.</desc>
  <rect width="1600" height="900" fill="#162421"/><text x="85" y="95" fill="#e6d9c5" font-family="Arial,sans-serif" font-size="20" letter-spacing="7">04 / CIRCULAR WORKPLACE</text><text x="85" y="190" fill="#f1ece4" font-family="Georgia,serif" font-size="72">A shared centre is a spatial promise.</text><text x="85" y="265" fill="#d8ad70" font-family="Georgia,serif" font-size="66">Occupation is the test.</text>
  <g transform="translate(170 335)" fill="none"><ellipse cx="430" cy="230" rx="390" ry="188" fill="#243833" stroke="#c99d61" stroke-width="8"/><ellipse cx="430" cy="230" rx="220" ry="94" fill="#58735d" stroke="#e8d0a2" stroke-width="5"/><path d="M59 201c88-102 173-66 267-115 101-52 179 72 270 28 92-45 151-1 205 70" stroke="#f0dcb6" stroke-width="12"/><path d="M81 261c105 93 205 55 304 93 110 43 199-63 294-23 71 30 108-5 134-48" stroke="#9c7546" stroke-width="7"/><g fill="#d1b17f"><circle cx="377" cy="210" r="12"/><circle cx="452" cy="195" r="16"/><circle cx="506" cy="244" r="11"/><circle cx="396" cy="264" r="14"/></g></g>
  <g transform="translate(1050 348)" font-family="Arial,sans-serif"><path d="M0 0h420v365H0z" fill="#21312e" stroke="#80643f" stroke-width="2"/><text x="40" y="65" fill="#d6ad72" font-size="18" letter-spacing="4">WHAT TO VERIFY</text><g fill="#eee7db" font-size="27"><text x="40" y="130">DAYLIGHT</text><text x="40" y="185">COMFORT</text><text x="40" y="240">SHARED ROUTES</text><text x="40" y="295">ENERGY IN USE</text></g><circle cx="350" cy="130" r="11" fill="#d6ad72"/><circle cx="350" cy="185" r="11" fill="#d6ad72"/><circle cx="350" cy="240" r="11" fill="#d6ad72"/><circle cx="350" cy="295" r="11" fill="#d6ad72"/></g>
  <text x="85" y="844" fill="#bac4be" font-family="Arial,sans-serif" font-size="20">Award recognition begins the question; post-occupancy evidence completes it.</text>
