<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Airport as a regional threshold</title><desc id="desc">An original not-to-scale schematic connecting Sydney’s harbour, Parramatta and Western Parkland centres with a western airport and a public arrival sequence.</desc>
