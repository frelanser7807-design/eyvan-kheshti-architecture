<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 850" role="img" aria-labelledby="title desc"><title id="title">Adequate housing for all</title><desc id="desc">Original diagram showing housing as a right supported by affordability, safety, access and climate response.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07131c"/><stop offset="1" stop-color="#21363b"/></linearGradient></defs><rect width="1600" height="850" fill="url(#bg)"/><g stroke="#34545b" opacity=".55"><path d="M0 180H1600M0 360H1600M0 540H1600M0 720H1600"/><path d="M260 0V850M520 0V850M780 0V850M1040 0V850M1300 0V850"/></g><text x="100" y="100" fill="#e0b66c" font-family="Arial,sans-serif" font-size="24" letter-spacing="5">WORLD ARCH JOURNAL · EDITORIAL DIAGRAM</text><text x="100" y="185" fill="#f7f2e8" font-family="Georgia,serif" font-size="66">Housing is a human right. Build it.</text><text x="100" y="235" fill="#b8c8c8" font-family="Arial,sans-serif" font-size="25">UIA theme for World Architecture Day · 5 October 2026</text><g transform="translate(800 500)"><path d="M-210-15L0-190 210-15V190H-210Z" fill="#10232a" stroke="#d8ae63" stroke-width="7"/><path d="M-260-15L0-240 260-15" fill="none" stroke="#f7f2e8" stroke-width="12"/><path d="M-45 190V50H45V190M-140 55H-70V120H-140ZM70 55H140V120H70Z" fill="none" stroke="#87b8c2" stroke-width="8"/><g fill="#f7f2e8" font-family="Arial,sans-serif" text-anchor="middle" font-size="25"><text x="-350" y="-100">SAFE</text><text x="350" y="-100">AFFORDABLE</text><text x="-350" y="145">ACCESSIBLE</text><text x="350" y="145">CLIMATE-READY</text></g><g fill="#e0b66c"><circle cx="-300" cy="-110" r="9"/><circle cx="300" cy="-110" r="9"/><circle cx="-300" cy="135" r="9"/><circle cx="300" cy="135" r="9"/></g></g><text x="800" y="790" text-anchor="middle" fill="#d7e0df" font-family="Arial,sans-serif" font-size="24" letter-spacing="2">OUR READING: DESIGN, POLICY AND ADVOCACY MUST MEET</text></svg>
