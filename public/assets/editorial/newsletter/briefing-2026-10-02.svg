<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Three tests for public value in architecture</title>
  <desc id="desc">An original editorial diagram connecting a mixed-use planning submission, a public architecture festival and a proposed city tower through access, evidence and long-term value.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09100f"/>
      <stop offset="1" stop-color="#172421"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#54e3bd"/>
      <stop offset="1" stop-color="#d4ad67"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g fill="none" stroke="#29423b" stroke-width="2" opacity=".7">
    <path d="M0 180H1600M0 360H1600M0 540H1600M0 720H1600"/>
    <path d="M320 0V900M640 0V900M960 0V900M1280 0V900"/>
  </g>
  <text x="90" y="105" fill="#54e3bd" font-family="Arial, sans-serif" font-size="25" letter-spacing="6">WORLD ARCH JOURNAL · 02 OCTOBER 2026</text>
  <text x="90" y="190" fill="#f4f0e8" font-family="Georgia, serif" font-size="72">What makes a city project public?</text>
  <text x="92" y="245" fill="#b9c7c2" font-family="Arial, sans-serif" font-size="28">An editorial diagram — not a depiction of the reported projects</text>
  <path d="M210 560H1390" stroke="url(#line)" stroke-width="8" stroke-linecap="round"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g transform="translate(300 560)">
      <circle r="118" fill="#0d1715" stroke="#54e3bd" stroke-width="5"/>
      <path d="M-60 40V-25L0-70 60-25V40M-38 40V0H38V40" fill="none" stroke="#f4f0e8" stroke-width="10" stroke-linejoin="round"/>
      <text y="170" fill="#f4f0e8" font-size="31" font-weight="700">PLANNING</text>
      <text y="207" fill="#a9bbb5" font-size="22">Who benefits?</text>
    </g>
    <g transform="translate(800 560)">
      <circle r="118" fill="#0d1715" stroke="#80b9ff" stroke-width="5"/>
      <path d="M-66 35C-30-42 30-42 66 35M-45 8H45M0-55V62" fill="none" stroke="#f4f0e8" stroke-width="10" stroke-linecap="round"/>
      <text y="170" fill="#f4f0e8" font-size="31" font-weight="700">ACCESS</text>
      <text y="207" fill="#a9bbb5" font-size="22">Who can take part?</text>
    </g>
    <g transform="translate(1300 560)">
      <circle r="118" fill="#0d1715" stroke="#d4ad67" stroke-width="5"/>
      <path d="M-58 48V5H-20V-35H20V-72H58V48M-75 48H75" fill="none" stroke="#f4f0e8" stroke-width="10" stroke-linejoin="round"/>
      <text y="170" fill="#f4f0e8" font-size="31" font-weight="700">DELIVERY</text>
      <text y="207" fill="#a9bbb5" font-size="22">What becomes real?</text>
    </g>
  </g>
  <text x="800" y="840" text-anchor="middle" fill="#d8e1dd" font-family="Arial, sans-serif" font-size="27" letter-spacing="2">PUBLIC VALUE NEEDS ACCESS · EVIDENCE · ACCOUNTABILITY</text>
</svg>
