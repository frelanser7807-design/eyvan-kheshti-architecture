<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Spatial sequence as composition</title><desc id="desc">An original abstract sequence diagram of rooms, turns and pauses, not a plan of any named project.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#141b1d"/><stop offset="1" stop-color="#293334"/></linearGradient><linearGradient id="g"><stop stop-color="#d09a54"/><stop offset="1" stop-color="#f3d39b"/></linearGradient></defs>
  <rect width="1200" height="600" fill="url(#bg)"/><path d="M0 480H1200" stroke="#d2a66b" stroke-opacity=".18"/>
  <path d="M150 352H345V260H520V352H680V230H860V352H1050" fill="none" stroke="url(#g)" stroke-width="5"/>
  <g fill="#1a2325" stroke="#ead9ba" stroke-width="3"><rect x="122" y="300" width="70" height="104"/><rect x="317" y="224" width="58" height="72"/><rect x="490" y="300" width="60" height="104"/><rect x="652" y="194" width="56" height="72"/><rect x="832" y="300" width="58" height="104"/><rect x="1022" y="300" width="70" height="104"/></g>
  <g fill="#e7d3ae"><circle cx="151" cy="352" r="8"/><circle cx="346" cy="260" r="8"/><circle cx="520" cy="352" r="8"/><circle cx="680" cy="230" r="8"/><circle cx="861" cy="352" r="8"/><circle cx="1050" cy="352" r="8"/></g>
  <g fill="#f3eee4" font-family="Arial,sans-serif" text-anchor="middle"><text x="600" y="92" font-family="Georgia,serif" font-size="42">A story is made of relationships</text><text x="150" y="455" font-size="18" letter-spacing="3">ARRIVE</text><text x="346" y="455" font-size="18" letter-spacing="3">TURN</text><text x="520" y="455" font-size="18" letter-spacing="3">PAUSE</text><text x="680" y="455" font-size="18" letter-spacing="3">REVEAL</text><text x="861" y="455" font-size="18" letter-spacing="3">REMEMBER</text><text x="1050" y="455" font-size="18" letter-spacing="3">LEAVE</text><text x="600" y="535" font-size="16" fill="#d8bc8b">CONCEPTUAL SEQUENCE · NOT A PROJECT PLAN</text></g>
</svg>
