<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Conservation as living knowledge</title><desc id="desc">A conceptual cycle connecting earthen material, skilled craft, community leadership, repair and knowledge passed to future stewards.</desc>
  <rect width="1200" height="600" fill="#eee9df"/><circle cx="600" cy="316" r="180" fill="none" stroke="#bd8c57" stroke-width="4" stroke-dasharray="14 12"/>
  <g fill="#fffaf0" stroke="#5a615b" stroke-width="3"><rect x="455" y="92" width="290" height="90" rx="45"/><rect x="780" y="260" width="290" height="90" rx="45"/><rect x="455" y="448" width="290" height="90" rx="45"/><rect x="130" y="260" width="290" height="90" rx="45"/></g>
  <path d="M710 180q100 24 130 92M866 352q-32 88-121 110M456 494q-103-28-123-145M331 260q29-93 126-116" fill="none" stroke="#bd8c57" stroke-width="5" marker-end="url(#arrow)"/>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4 0 8z" fill="#bd8c57"/></marker></defs>
  <g font-family="Arial,sans-serif" text-anchor="middle" fill="#283334"><text x="600" y="51" font-size="25" letter-spacing="4">HERITAGE IS ALSO A PRACTICE</text><text x="600" y="147" font-size="20">EARTH + PLACE</text><text x="925" y="315" font-size="20">CRAFT + REPAIR</text><text x="600" y="503" font-size="20">COMMUNITY + STEWARDSHIP</text><text x="275" y="315" font-size="20">LEARNING + TRANSFER</text><text x="600" y="302" font-size="23" fill="#9a6f3f">CARE</text><text x="600" y="335" font-size="16" fill="#67716a">over time</text><text x="600" y="575" font-size="14" letter-spacing="2" fill="#768079">CONCEPTUAL DIAGRAM · NOT A RESTORATION SPECIFICATION</text></g>
</svg>
