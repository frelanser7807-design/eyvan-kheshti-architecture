<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">5 October 2026: Housing, thresholds and shared ground</title>
  <desc id="desc">Original World Arch Journal editorial diagram connecting adequate housing, adaptive museum space and a movable public installation.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07131c"/><stop offset="1" stop-color="#192b32"/></linearGradient><linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#d8ae63"/><stop offset="1" stop-color="#fff1bd"/></linearGradient></defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g stroke="#28444b" stroke-width="2" opacity=".7"><path d="M0 180H1600M0 360H1600M0 540H1600M0 720H1600"/><path d="M320 0V900M640 0V900M960 0V900M1280 0V900"/></g>
  <text x="90" y="100" fill="#e0b66c" font-family="Arial,sans-serif" font-size="25" letter-spacing="6">WORLD ARCH JOURNAL · 05 OCTOBER 2026</text>
  <text x="90" y="185" fill="#f7f2e8" font-family="Georgia,serif" font-size="70">Housing, thresholds and shared ground</text>
  <text x="92" y="235" fill="#b8c8c8" font-family="Arial,sans-serif" font-size="26">Original editorial diagram · not a depiction of the reported projects</text>
  <path d="M210 545H1390" stroke="url(#gold)" stroke-width="8" stroke-linecap="round"/>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <g transform="translate(300 545)"><circle r="118" fill="#0d1d26" stroke="#d8ae63" stroke-width="5"/><path d="M-68 35V-25L0-78 68-25V35M-38 35V-12H38V35M-78 60H78" fill="none" stroke="#f7f2e8" stroke-width="10" stroke-linejoin="round"/><text y="170" fill="#f7f2e8" font-size="30" font-weight="700">HOUSING</text><text y="207" fill="#b8c8c8" font-size="22">a human right</text></g>
    <g transform="translate(800 545)"><circle r="118" fill="#0d1d26" stroke="#87b8c2" stroke-width="5"/><path d="M-66 50V-40H66V50M-45 10H45M-25-40V50M25-40V50" fill="none" stroke="#f7f2e8" stroke-width="10"/><text y="170" fill="#f7f2e8" font-size="30" font-weight="700">ENSEMBLE</text><text y="207" fill="#b8c8c8" font-size="22">art · park · city</text></g>
    <g transform="translate(1300 545)"><circle r="118" fill="#0d1d26" stroke="#d8ae63" stroke-width="5"/><path d="M-74 45H74M-50 45V-15M-15 45V-65M22 45V-10M57 45V-45M-75-5H-35M-35-55H5M5 0H48" fill="none" stroke="#f7f2e8" stroke-width="10" stroke-linecap="round"/><text y="170" fill="#f7f2e8" font-size="30" font-weight="700">THRESHOLD</text><text y="207" fill="#b8c8c8" font-size="22">space can move</text></g>
  </g>
  <text x="800" y="840" text-anchor="middle" fill="#d7e0df" font-family="Arial,sans-serif" font-size="26" letter-spacing="2">ARCHITECTURE EARNS VALUE THROUGH USE, CARE AND ACCESS</text>
</svg>
