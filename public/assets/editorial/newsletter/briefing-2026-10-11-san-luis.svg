  <g fill="#f3eee4" font-family="Arial,sans-serif" text-anchor="middle"><text x="385" y="410" font-size="17" letter-spacing="2">LIVING + WORKING</text><text x="627" y="410" font-size="17" letter-spacing="2">SLIDING SCREEN</text><text x="842" y="410" font-size="17" letter-spacing="2">SLEEP + STORAGE</text><text x="600" y="520" font-size="16" fill="#d8bc8b">CONCEPTUAL ZONING · NOT THE REPORTED APARTMENT PLAN</text></g>
</svg>
