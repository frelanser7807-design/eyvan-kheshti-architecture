<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Compact living as a set of daily routines</title><desc id="desc">An original conceptual diagram of living, sleeping and storage zones with a sliding screen; not the San Luis floor plan.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#151d1e"/><stop offset="1" stop-color="#2a3332"/></linearGradient><linearGradient id="g"><stop stop-color="#d09a54"/><stop offset="1" stop-color="#f3d39b"/></linearGradient></defs>
  <rect width="1200" height="600" fill="url(#bg)"/><text x="600" y="88" fill="#f3eee4" font-family="Georgia,serif" font-size="42" text-anchor="middle">Storage is part of the spatial plan</text>
  <rect x="210" y="156" width="780" height="300" rx="10" fill="#202a2b" stroke="#ead9ba" stroke-width="3"/><rect x="240" y="184" width="290" height="242" fill="#d2a66b" fill-opacity=".18" stroke="#d2a66b"/><rect x="530" y="184" width="195" height="242" fill="#f1ddba" fill-opacity=".08" stroke="#ead9ba"/><rect x="725" y="184" width="235" height="242" fill="#d2a66b" fill-opacity=".12" stroke="#d2a66b"/>
