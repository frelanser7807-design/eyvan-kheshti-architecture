<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="t d"><title id="t">Three evidence lenses for architecture news</title><desc id="d">Original diagram linking performance evidence, retained fabric and lived use.</desc><rect width="1200" height="600" fill="#f6f1e7"/><path d="M70 65h1060M70 535h1060" stroke="#bf9658" stroke-width="4"/><text x="70" y="128" fill="#142933" font-family="Arial" font-size="36" font-weight="bold">WHAT SURVIVES THE IMAGE?</text><path d="M250 300h700" stroke="#aa9878" stroke-width="8"/><circle cx="250" cy="300" r="122" fill="#173543"/><circle cx="600" cy="300" r="122" fill="#a87938"/><circle cx="950" cy="300" r="122" fill="#173543"/><g fill="#fff9eb" font-family="Arial" text-anchor="middle"><text x="250" y="285" font-size="27" font-weight="bold">EVIDENCE</text><text x="250" y="328" font-size="20">model / measure</text><text x="600" y="285" font-size="27" font-weight="bold">FABRIC</text><text x="600" y="328" font-size="20">retain / adapt</text><text x="950" y="285" font-size="27" font-weight="bold">PEOPLE</text><text x="950" y="328" font-size="20">listen / operate</text></g><text x="70" y="488" fill="#48555a" font-family="Arial" font-size="25">An editorial framework, not a claim that these sources report equivalent evidence.</text></svg>
