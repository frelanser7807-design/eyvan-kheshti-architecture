<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" role="img" aria-label="Diagram of a pointed arch bay with rib vault and flying buttress">
  <rect x="0" y="0" width="640" height="430" fill="#f4f0e6"/>
  <g stroke="#23231f" stroke-width="3" fill="none" stroke-linecap="round">
    <!-- inner pier -->
    <line x1="150" y1="380" x2="150" y2="210"/>
    <line x1="128" y1="380" x2="172" y2="380"/>
    <!-- pointed arch from inner pier to wall pier -->
    <path d="M150 210 Q 235 120 320 105 Q 405 120 460 175"/>
    <!-- rib vault diagonals -->
    <path d="M150 210 Q 300 90 452 168" stroke-width="1.6"/>
    <path d="M150 210 Q 310 150 452 168" stroke-width="1.6"/>
    <!-- wall / clerestory -->
    <line x1="452" y1="168" x2="452" y2="380"/>
    <line x1="430" y1="380" x2="474" y2="380"/>
    <!-- flying buttress -->
    <path d="M452 205 Q 520 190 545 235" stroke="#a07f3c" stroke-width="4"/>
    <line x1="545" y1="235" x2="545" y2="380" stroke="#a07f3c" stroke-width="4"/>
    <line x1="523" y1="380" x2="567" y2="380" stroke="#a07f3c"/>
    <!-- pinnacle -->
    <path d="M545 235 l0 -28 M533 207 h24" stroke="#a07f3c" stroke-width="2.4"/>
    <!-- ground -->
    <line x1="60" y1="380" x2="600" y2="380" stroke-width="2"/>
    <!-- thrust arrows -->
    <path d="M330 118 Q 430 150 500 205" stroke="#c6a15b" stroke-width="2.4" stroke-dasharray="6 6"/>
    <path d="M500 205 l-14 -1 M500 205 l-4 -13" stroke="#c6a15b" stroke-width="2.4"/>
  </g>
  <g font-family="Inter, Arial, sans-serif" font-size="15" fill="#23231f">
    <text x="96" y="90">Pointed arch</text>
    <text x="238" y="66">Rib vault</text>
    <text x="440" y="130" fill="#a07f3c">Flying buttress</text>
    <text x="470" y="330" fill="#a07f3c">Buttress pier</text>
    <text x="330" y="185" fill="#a07f3c">line of thrust</text>
    <text x="88" y="408">Pier</text>
    <text x="418" y="408">Wall pier</text>
  </g>
  <g stroke="#8a8474" stroke-width="1">
    <line x1="150" y1="196" x2="128" y2="104"/>
    <line x1="300" y1="98" x2="292" y2="76"/>
  </g>
</svg>
