<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" role="img" aria-label="Diagram of a dome on pendentives over a square bay">
  <rect x="0" y="0" width="640" height="430" fill="#f4f0e6"/>
  <g stroke="#23231f" stroke-width="3" fill="none" stroke-linecap="round">
    <!-- dome shell -->
    <path d="M170 190 A 150 150 0 0 1 470 190"/>
    <path d="M186 190 A 134 134 0 0 1 454 190" stroke-width="1.6"/>
    <!-- oculus -->
    <line x1="298" y1="44" x2="342" y2="44" stroke="#a07f3c" stroke-width="4"/>
    <!-- drum -->
    <line x1="170" y1="190" x2="170" y2="222"/>
    <line x1="470" y1="190" x2="470" y2="222"/>
    <line x1="170" y1="222" x2="470" y2="222" stroke-width="1.6"/>
    <!-- pendentives -->
    <path d="M170 222 Q 320 300 470 222" stroke="#a07f3c" stroke-width="3"/>
    <path d="M170 222 Q 240 268 250 330" stroke="#a07f3c" stroke-width="2"/>
    <path d="M470 222 Q 400 268 390 330" stroke="#a07f3c" stroke-width="2"/>
    <!-- supporting arches and piers -->
    <path d="M250 330 A 70 46 0 0 1 390 330" stroke-width="2.4"/>
    <line x1="250" y1="330" x2="250" y2="384"/>
    <line x1="390" y1="330" x2="390" y2="384"/>
    <line x1="222" y1="384" x2="278" y2="384"/>
    <line x1="362" y1="384" x2="418" y2="384"/>
    <line x1="60" y1="384" x2="580" y2="384" stroke-width="2"/>
  </g>
  <g font-family="Inter, Arial, sans-serif" font-size="15" fill="#23231f">
    <text x="288" y="28" fill="#a07f3c">Oculus</text>
    <text x="86" y="120">Dome shell</text>
    <text x="492" y="212">Drum</text>
    <text x="452" y="292" fill="#a07f3c">Pendentive</text>
    <text x="282" y="300">Supporting arch</text>
    <text x="238" y="410">Pier</text>
    <text x="392" y="410">Pier</text>
  </g>
  <g stroke="#8a8474" stroke-width="1">
    <line x1="210" y1="130" x2="168" y2="118"/>
  </g>
</svg>
