name: Deploy World Arch Journal to Cloudflare Pages

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "netlify/**"
      - "agent-system/**"
      - "media-parts/**"
      - "scripts/**"
      - "tests/**"
      - "functions/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - "netlify.toml"
      - ".github/workflows/deploy-netlify-command-center.yml"

permissions:
  contents: read

concurrency:
  group: world-arch-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for newsletter PDF generation
        run: npx playwright install --with-deps chromium

      - name: Build and verify publication package
        run: |
          npm run build
          node --test tests/newsletter-publication.test.mjs tests/newsletter.test.mjs
          npm run smoke
          node --input-type=module <<'NODE'
          import { access, readFile } from 'node:fs/promises';
          for (const path of ['dist/index.html', 'dist/sitemap.xml', 'dist/newsletter/feed.xml', 'dist/news-sitemap.xml']) {
            await access(path);
          }
          const sitemap = await readFile('dist/sitemap.xml', 'utf8');
          if (!sitemap.includes('/articles/')) throw new Error('Generated sitemap contains no article pages.');
          if (!sitemap.includes('/newsletter/')) throw new Error('Generated sitemap contains no newsletter pages.');
          const feed = await readFile('dist/newsletter/feed.xml', 'utf8');
          if (!feed.includes('<item>')) throw new Error('Generated newsletter RSS feed has no items.');
          console.log('Build outputs, article/newsletter sitemap entries and RSS feed are present.');
          NODE

      - name: Deploy preview to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=world-arch-journal --branch=preview-${{ github.run_id }}

      - name: Verify preview pages, articles, newsletter, feed, and images
        env:
          PREVIEW_ORIGIN: https://preview-${{ github.run_id }}.world-arch-journal.pages.dev
        run: |
          node --input-type=module <<'NODE'
          const origin = process.env.PREVIEW_ORIGIN;
          const fetchOk = async (path) => {
            let lastError;
            for (let attempt = 0; attempt < 12; attempt++) {
              try {
                const response = await fetch(new URL(path, origin), { redirect: 'follow' });
                if (response.ok) return response;
                lastError = new Error(`${path}: HTTP ${response.status}`);
              } catch (error) {
                lastError = error;
              }
              await new Promise((resolve) => setTimeout(resolve, 5000));
            }
            throw lastError ?? new Error(`Preview did not respond: ${path}`);
          };
          const sitemap = await (await fetchOk('/sitemap.xml')).text();
          const paths = [...sitemap.matchAll(/<loc>(.*?)<\/loc>/g)]
            .map((match) => new URL(match[1], origin).pathname)
            .filter((path) => path !== '/sitemap.xml');
          if (!paths.some((path) => path.startsWith('/articles/'))) throw new Error('Sitemap contains no articles.');
          if (!paths.some((path) => path.startsWith('/newsletter/'))) throw new Error('Sitemap contains no newsletter issues.');
          const required = [...new Set(['/', '/newsletter/feed.xml', ...paths])];
          let cursor = 0;
          const failures = [];
          await Promise.all(Array.from({ length: 8 }, async () => {
            while (cursor < required.length) {
              const path = required[cursor++];
              try { await fetchOk(path); }
              catch (error) { failures.push(String(error)); }
            }
          }));
          const imageUrls = [...sitemap.matchAll(/<image:loc>(.*?)<\/image:loc>/g)]
            .slice(0, 12).map((match) => new URL(match[1], origin));
          for (const imageUrl of imageUrls) {
            if (imageUrl.hostname === 'worldarchjournal.com') imageUrl.host = new URL(origin).host;
            try { await fetchOk(imageUrl.href); }
            catch (error) { failures.push(String(error)); }
          }
          if (failures.length) throw new Error(failures.join('\n'));
          console.log(`Preview verified: ${required.length} page/feed routes and ${imageUrls.length} images.`);
          NODE

      - name: Deploy verified build to Cloudflare Pages production
        if: github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=world-arch-journal --branch=main

      - name: Verify production domain
        if: github.ref == 'refs/heads/main'
        env:
          PRODUCTION_ORIGIN: https://worldarchjournal.com
        run: |
          node --input-type=module <<'NODE'
          const origin = process.env.PRODUCTION_ORIGIN;
          const check = async (path) => {
            let lastError;
            for (let attempt = 0; attempt < 10; attempt++) {
              try {
                const response = await fetch(new URL(path, origin), { redirect: 'follow' });
                if (response.ok) return response;
                lastError = new Error(`${path}: HTTP ${response.status}`);
              } catch (error) {
                lastError = error;
              }
              await new Promise((resolve) => setTimeout(resolve, 3000));
            }
            throw lastError ?? new Error(`Production route did not respond: ${path}`);
          };
          const sitemap = await (await check('/sitemap.xml')).text();
          const paths = [...sitemap.matchAll(/<loc>(.*?)<\/loc>/g)]
            .map((match) => new URL(match[1], origin).pathname)
            .filter((path) => path !== '/sitemap.xml');
          if (!paths.some((path) => path.startsWith('/articles/'))) throw new Error('Live sitemap contains no articles.');
          if (!paths.some((path) => path.startsWith('/newsletter/'))) throw new Error('Live sitemap contains no newsletter issues.');
          const required = [...new Set(['/', '/newsletter/feed.xml', ...paths])];
          let cursor = 0;
          const failures = [];
          await Promise.all(Array.from({ length: 8 }, async () => {
            while (cursor < required.length) {
              const path = required[cursor++];
              try { await check(path); }
              catch (error) { failures.push(String(error)); }
            }
          }));
          if (failures.length) throw new Error(failures.join('\n'));
          console.log(`Production verified: ${required.length} routes on worldarchjournal.com.`);
          NODE
